<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Cadet - 150% Zoom</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

/* wrapper keeps viewport clean */
.wrapper {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: relative;
}

/* 150% zoom effect */
iframe {
    width: 66.6667%;
    height: 66.6667%;
    transform: scale(1.5);
    transform-origin: 0 0;
    border: none;
}
</style>
</head>

<body>
<div class="wrapper">
    <iframe
        src="https://www.gameflare.com/embed/3d-pinball-space-cadet/"
        allowfullscreen>
    </iframe>
</div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Cadet</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

.wrapper {
    width: 100vw;
    height: 100vh;
    position: relative;
}

/* CENTER first, then apply zoom + DOWNWARD shift */
.zoom {
    width: 2560px;
    height: 1440px;

    position: absolute;
    top: 50%;
    left: 50%;

    /* key fix: translate Y POSITIVE = DOWN */
   transform: translate(-50%, -50%) scale(1.5) translateY(440px);

    transform-origin: center;
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
}
</style>
</head>

<body>
<div class="wrapper">
    <div class="zoom">
        <iframe src="https://www.gameflare.com/embed/3d-pinball-space-cadet/" allowfullscreen></iframe>
    </div>
</div>
</body>
</html>

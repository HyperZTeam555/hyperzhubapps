<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GD Web Dashers</title>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: sans-serif;
      background: #000;
    }
  </style>
</head>
<body>

<div id="loading">Loading repo...</div>
<iframe id="frame"></iframe>

<script>
const REPOS = [
  "https://cdn.jsdelivr.net/gh/web-dashers/web-dashers.github.io@main",
  "https://rawcdn.githack.com/web-dashers/web-dashers.github.io/main",
  "https://cdn.statically.io/gh/web-dashers/web-dashers.github.io/main",
  "https://raw.githubusercontent.com/web-dashers/web-dashers.github.io/main",
  "https://cdn.jsdelivr.net/gh/web-dashers/web-dashers.github.io",
  "https://fastly.jsdelivr.net/gh/web-dashers/web-dashers.github.io@main",
  "https://gcore.jsdelivr.net/gh/web-dashers/web-dashers.github.io@main",
  "https://testingcf.jsdelivr.net/gh/web-dashers/web-dashers.github.io@main",
  "https://originfastly.jsdelivr.net/gh/web-dashers/web-dashers.github.io@main",
  "https://purge.jsdelivr.net/gh/web-dashers/web-dashers.github.io@main"
];

const PAGES = [
  "index.html",
  "Public/index.html"
];

async function tryUrl(base, page) {
  const url = `${base}/${page}`;

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 8000);

  try {
    const res = await fetch(url, {
      signal: controller.signal,
      cache: "no-store"
    });

    if (!res.ok) throw new Error();

    const html = await res.text();

    clearTimeout(timeout);

    return {
      html,
      base
    };
  } finally {
    clearTimeout(timeout);
  }
}

async function load() {
  document.getElementById("loading").textContent =
    "Racing CDNs...";

  const promises = [];

  for (const base of REPOS) {
    for (const page of PAGES) {
      promises.push(tryUrl(base, page));
    }
  }

  let result;

  try {
    result = await Promise.any(promises);
  } catch {
    document.getElementById("loading").textContent =
      "Failed to load repo";
    return;
  }

  let { html, base } = result;

  html = html.replace(
    /<head>/i,
    `<head><base href="${base}/">`
  );

  html = html.replace(
    /(src|href)=["'](?!https?:\/\/|\/\/|data:|#)(.*?)["']/g,
    (_, attr, path) =>
      `${attr}="${base}/${path.replace(/^\.?\//, "")}"`
  );

  const iframe = document.getElementById("frame");
  iframe.srcdoc = html;

  iframe.onload = () => {
    document.getElementById("loading").style.display = "none";
  };
}

load();
</script>

</body>
</html>

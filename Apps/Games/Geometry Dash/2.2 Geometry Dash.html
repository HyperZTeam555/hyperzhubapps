<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Geometry Dash</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    iframe {
      width: 100vw;
      height: 100vh;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>

<iframe id="game" allowfullscreen></iframe>

<script>
  const mirrors = [
    "https://hyperzteam456.github.io/webgl-dashers/",
    "https://web-dashers.github.io/",
    "https://raw.githack.com/web-dashers/web-dashers.github.io/main/index.html"
  ];

  const iframe = document.getElementById("game");

  async function loadGame() {
    for (const url of mirrors) {
      try {
        await fetch(url, { method: "HEAD", mode: "no-cors", cache: "no-store" });
        iframe.src = url;
        return;
      } catch (e) {}
    }
    iframe.src = mirrors[0];
  }

  loadGame();
</script>

</body>
</html>

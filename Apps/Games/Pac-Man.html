<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pac-Man Loader</title>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: sans-serif;
      background: #000;
    }
  </style>
</head>
<body>

<div id="loading">Loading Pac-Man...</div>

<iframe id="frame"></iframe>

<script>
const URL = "https://masonicgit.github.io/pacman/";

const iframe = document.getElementById("frame");
iframe.src = URL;

iframe.onload = () => {
  document.getElementById("loading").style.display = "none";
};
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slope Plus</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    .viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: black;
    }

    iframe {
      position: absolute;
      top: 50%;
      left: 50%;

      width: 100vw;
      height: 100vh;

      border: none;

      transform: translate(-50%, -50%) scale(1.9);
      transform-origin: center center;
    }
  </style>
</head>
<body>

  <div class="viewport">
    <iframe
      src="https://html-classic.itch.zone/html/14788017/SlopePlus1.3.1Web/index.html"
      allowfullscreen>
    </iframe>
  </div>

</body>
</html>

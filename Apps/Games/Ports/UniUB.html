<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniUB</title>

<style>
body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0a0a0f;
    color: #a855f7;
    font-family: 'Courier New', monospace;
    overflow: hidden;
}

/* CENTER EVERYTHING */
#home {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center; /* vertical center */
    height: 100vh;
    text-align: center;
}

h1 {
    font-size: 2.5rem;
    letter-spacing: 4px;
    text-shadow: 0 0 15px #a855f7;
}

/* MAIN BUTTON */
.main-btn {
    margin: 20px 0;
    width: 320px;
    padding: 18px;
    font-size: 1.3rem;
    background: #a855f7;
    color: black;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.3s;
}

.main-btn:hover {
    background: #d8b4fe;
    transform: scale(1.05);
    box-shadow: 0 0 25px #a855f7;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 15px;
    width: 80%;
    max-width: 700px;
}

.grid button {
    padding: 15px;
    background: transparent;
    border: 2px solid #a855f7;
    color: #a855f7;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.25s;
}

.grid button:hover {
    background: #a855f7;
    color: black;
    box-shadow: 0 0 15px #a855f7;
}

/* VIEWER */
#viewer {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
}

/* SMALL TOP-LEFT X */
.close-btn {
    position: absolute;
    top: 10px;
    left: 12px;
    font-size: 18px;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(6px);
    border: 1px solid #a855f7;
    color: #a855f7;
    padding: 2px 8px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
    z-index: 10;
}

.close-btn:hover {
    background: #a855f7;
    color: black;
}
</style>
</head>

<body>

<div id="home">
    <h1>UniUB</h1>

    <button class="main-btn" onclick="openSite('https://jobi.one/')">
        MAIN LINK
    </button>

    <div class="grid">
        <button onclick="openSite('https://wildcard.thetravelingtourguide.com/')">Link 1</button>
        <button onclick="openSite('https://1.thetravelingtourguide.com/')">Link 2</button>
        <button onclick="openSite('https://2.thetravelingtourguide.com/')">Link 3</button>
        <button onclick="openSite('https://3.thetravelingtourguide.com/')">Link 4</button>
        <button onclick="openSite('https://4.thetravelingtourguide.com/')">Link 5</button>
        <button onclick="openSite('https://5.thetravelingtourguide.com/')">Link 6</button>
        <button onclick="openSite('https://tobias.myaddr.dev/')">Link 7</button>
        <button onclick="openSite('https://tobias.myaddr.io/')">Link 8</button>
        <button onclick="openSite('https://tobias.myaddr.tools/')">Link 9</button>
        <button onclick="openSite('https://uniub.svndns.de/')">YK</button>
    </div>
</div>

<div id="viewer">
    <div class="close-btn" onclick="closeViewer()">✕</div>
    <iframe id="frame"></iframe>
</div>

<script>
function openSite(url) {
    document.getElementById("home").style.display = "none";
    document.getElementById("viewer").style.display = "block";
    document.getElementById("frame").src = url;
}

function closeViewer() {
    document.getElementById("viewer").style.display = "none";
    document.getElementById("home").style.display = "flex";
    document.getElementById("frame").src = "";
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <title>UGS Files</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0c14;
            --bg-mid: #0f1220;
            --bg-card: rgba(255,255,255,0.04);
            --bg-card-hover: rgba(255,255,255,0.07);
            --accent: #7b6fff;
            --accent-glow: rgba(123,111,255,0.4);
            --accent2: #ff6b9d;
            --accent3: #00e5c3;
            --text: #e8eaf0;
            --text-muted: rgba(232,234,240,0.45);
            --border: rgba(255,255,255,0.08);
            --border-accent: rgba(123,111,255,0.3);
            --sidebar-w: 72px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-deep);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        /* ─── NOISE TEXTURE OVERLAY ─── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
            opacity: 0.5;
        }

        /* ─── BACKGROUND GLOW ORBS ─── */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 15% 20%, rgba(123,111,255,0.12) 0%, transparent 70%),
                radial-gradient(ellipse 40% 40% at 85% 75%, rgba(255,107,157,0.08) 0%, transparent 70%),
                radial-gradient(ellipse 50% 50% at 50% 50%, rgba(0,229,195,0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* ─── SIDEBAR ─── */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: var(--sidebar-w);
            height: 100vh;
            background: rgba(10,12,20,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid var(--border);
            padding: 16px 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
            z-index: 1000;
        }

        .sidebar::-webkit-scrollbar { width: 3px; }
        .sidebar::-webkit-scrollbar-track { background: transparent; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

        .sidebar-logo {
            font-family: 'Orbitron', monospace;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 0.1em;
            color: var(--accent);
            text-align: center;
            padding: 8px 4px 16px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 8px;
            text-shadow: 0 0 12px var(--accent-glow);
        }

        .sidebar-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 10px 6px;
            font-family: 'Orbitron', monospace;
            font-size: 13px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-muted);
            text-align: center;
            min-height: 42px;
            position: relative;
            overflow: hidden;
        }

        .sidebar-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            opacity: 0;
            transition: opacity 0.2s;
        }

        .sidebar-btn span {
            position: relative;
            z-index: 1;
        }

        .sidebar-btn:hover {
            border-color: var(--border-accent);
            color: white;
            transform: scale(1.05);
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .sidebar-btn:hover::before { opacity: 0.15; }

        .sidebar-btn.empty {
            opacity: 0.25;
            cursor: default;
        }

        .sidebar-btn.empty:hover {
            transform: none;
            box-shadow: none;
            border-color: var(--border);
            color: var(--text-muted);
        }

        .sidebar-btn.empty:hover::before { opacity: 0; }

        /* ─── MAIN CONTENT ─── */
        .main-content {
            margin-left: var(--sidebar-w);
            flex: 1;
            padding: 28px 40px 80px;
            position: relative;
            z-index: 1;
            max-width: calc(100vw - var(--sidebar-w));
        }

        /* ─── HERO HEADER ─── */
        .hero {
            text-align: center;
            margin-bottom: 20px;
            animation: fadeDown 0.7s ease both;
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .hero-title {
            font-family: 'Orbitron', monospace;
            font-size: clamp(24px, 4vw, 48px);
            font-weight: 900;
            letter-spacing: 0.08em;
            background: linear-gradient(135deg, #fff 20%, var(--accent) 55%, var(--accent2) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
            margin-bottom: 4px;
            filter: drop-shadow(0 0 30px rgba(123,111,255,0.3));
        }

        .hero-sub {
            font-size: 12px;
            font-weight: 400;
            color: var(--text-muted);
            letter-spacing: 0.18em;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        /* ─── META LINKS ─── */
        .meta-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            animation: fadeDown 0.7s 0.1s ease both;
        }

        .meta-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 100px;
            padding: 9px 18px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            text-decoration: none;
            transition: all 0.25s ease;
            cursor: pointer;
        }

        .meta-chip:hover {
            color: white;
            border-color: var(--border-accent);
            background: rgba(123,111,255,0.1);
            box-shadow: 0 0 20px rgba(123,111,255,0.2);
            transform: translateY(-2px);
        }

        .meta-chip .icon {
            font-size: 16px;
        }

        /* ─── SEARCH ─── */
        .search-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 32px;
            animation: fadeDown 0.7s 0.2s ease both;
        }

        .search-inner {
            position: relative;
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .search-row {
            position: relative;
            width: 100%;
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 15px;
            pointer-events: none;
        }

        #searchInput {
            width: 100%;
            padding: 15px 20px 15px 46px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 400;
            outline: none;
            transition: all 0.3s ease;
            letter-spacing: 0.01em;
        }

        #searchInput::placeholder { color: var(--text-muted); }

        #searchInput:focus {
            border-color: var(--accent);
            background: rgba(123,111,255,0.06);
            box-shadow: 0 0 0 4px rgba(123,111,255,0.12), 0 8px 32px rgba(0,0,0,0.3);
        }



        /* ─── LETTER SECTIONS ─── */
        .letter-section {
            max-width: 860px;
            margin: 0 auto 52px;
            animation: fadeUp 0.5s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .letter-section.empty { opacity: 0.3; }

        .letter-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .letter-badge {
            font-family: 'Orbitron', monospace;
            font-size: 22px;
            font-weight: 900;
            color: white;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(123,111,255,0.35);
        }

        .letter-divider {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--border-accent), transparent);
        }

        .letter-count {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .buttons-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .buttons-container button {
            width: calc(16.666% - 9px) !important;
            flex-shrink: 0;
            aspect-ratio: 1 / 1;
        }

        /* Full reset for converted buttons */
        .buttons-container button {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 8px 6px;
            font-family: 'DM Sans', sans-serif;
            font-size: clamp(9px, 1vw, 12px);
            font-weight: 500;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.22s ease;
            color: var(--text);
            text-align: center;
            letter-spacing: 0.01em;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: normal;
            word-break: break-word;
            overflow-wrap: break-word;
            line-height: 1.4;
            box-sizing: border-box;
        }

        .buttons-container button::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(123,111,255,0.15), rgba(255,107,157,0.1));
            opacity: 0;
            transition: opacity 0.2s;
            border-radius: 12px;
        }

        .buttons-container button:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-accent);
            color: white;
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3), 0 0 0 1px rgba(123,111,255,0.2);
        }

        .buttons-container button:hover::before { opacity: 1; }

        .buttons-container button:active {
            transform: translateY(-1px) scale(1.01);
        }
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 8px 6px;
            font-family: 'DM Sans', sans-serif;
            font-size: clamp(9px, 1vw, 12px);
            font-weight: 500;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.22s ease;
            color: var(--text);
            text-align: center;
            letter-spacing: 0.01em;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: normal;
            word-break: break-word;
            overflow-wrap: break-word;
            hyphens: auto;
            line-height: 1.4;
            box-sizing: border-box;
            vertical-align: middle;
        }

        .game-btn::before, input[type="button"]::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(123,111,255,0.15), rgba(255,107,157,0.1));
            opacity: 0;
            transition: opacity 0.2s;
            border-radius: 12px;
        }

        .game-btn:hover, input[type="button"]:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-accent);
            color: white;
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3), 0 0 0 1px rgba(123,111,255,0.2);
        }

        .game-btn:hover::before, input[type="button"]:hover::before {
            opacity: 1;
        }

        .game-btn:active, input[type="button"]:active {
            transform: translateY(-1px) scale(1.01);
        }

        .empty-message {
            color: var(--text-muted);
            font-size: 13px;
            font-style: italic;
            padding: 16px 0;
        }

        /* ─── SCROLLBAR ─── */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(123,111,255,0.3); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 768px) {
            :root { --sidebar-w: 56px; }
            .main-content { padding: 32px 20px 60px; }
            .sidebar-btn { font-size: 12px; padding: 8px 4px; }
            .meta-bar { gap: 10px; }
            .buttons-container button { width: calc(33.333% - 7px) !important; }
        }

        @media (max-width: 480px) {
            .buttons-container button { width: calc(50% - 6px) !important; }
        }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-logo">UGS</div>
    </div>

    <div class="main-content">

        <div class="hero">
            <h1 class="hero-title">UGS</h1>
            <p class="hero-sub">Ultimate Game Stash</p>
        </div>

        <div class="meta-bar">
            <a class="meta-chip"
               href="https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/"
               target="_blank">
                <span class="icon">📄</span>
                Google Doc
            </a>
            <a class="meta-chip"
               href="https://discord.gg/rmVsAqkpkA"
               target="_blank">
                <span class="icon">💬</span>
                Discord Server
            </a>
        </div>

        <div style="text-align:center; margin-bottom: 20px; animation: fadeDown 0.7s 0.15s ease both;">
            <span id="game-count-badge" style="
                display: inline-flex;
                align-items: center;
                gap: 8px;
                background: rgba(123,111,255,0.1);
                border: 1px solid rgba(123,111,255,0.25);
                border-radius: 100px;
                padding: 7px 18px;
                font-size: 13px;
                font-weight: 600;
                color: var(--text-muted);
                letter-spacing: 0.05em;
            ">
                <span style="font-size:15px;">🎮</span>
                <span id="game-count-text">Loading games...</span>
            </span>
        </div>

        <div class="search-wrap">
            <div class="search-inner">
                <div class="search-row">
                    <span class="search-icon">🔍</span>
                    <input type="text" placeholder="Search games..." id="searchInput" autocomplete="off">
                </div>
            </div>
        </div>

        <div id="sections-container"></div>

        <script>
            (function() {
                const input = document.getElementById('searchInput');
                let searchTimer;

                input.addEventListener('input', function() {
                    const raw = this.value;

                    // Silently strip everything non-base36 (spaces, symbols, etc.) for internal query only
                    // Nothing is changed visually — user sees exactly what they typed
                    const stripped = raw.replace(/[^a-zA-Z0-9]/g, '');
                    const expanded = stripped
                        .replace(/([a-z])([A-Z])/g, '$1 $2')
                        .replace(/([a-zA-Z])(\d)/g, '$1 $2')
                        .replace(/(\d)([a-zA-Z])/g, '$1 $2');

                    clearTimeout(searchTimer);
                    searchTimer = setTimeout(() => runSearch(expanded), 120);
                });

                function runSearch(query) {
                    // Case-insensitive: lowercase everything for comparison
                    const q = query.toLowerCase();
                    document.querySelectorAll('.letter-section').forEach(section => {
                        let visible = 0;
                        section.querySelectorAll('.buttons-container button').forEach(btn => {
                            const match = !q || btn.textContent.toLowerCase().includes(q);
                            btn.style.display = match ? '' : 'none';
                            if (match) visible++;
                        });
                        section.style.display = visible === 0 && q ? 'none' : '';
                    });
                }
            })();
        </script>

    </div>

        <div id="game-overlay" style="display:none; position:fixed; inset:0; z-index:9999; background:#000; flex-direction:column;">
            <iframe id="game-frame" style="flex:1; width:100%; border:none; display:block;"></iframe>
            <button id="overlay-close" style="
                position: fixed;
                bottom: 24px;
                left: 24px;
                width: 48px;
                height: 48px;
                border-radius: 50%;
                background: rgba(20,20,30,0.92);
                border: 2px solid rgba(123,111,255,0.5);
                color: white;
                font-size: 20px;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 4px 20px rgba(0,0,0,0.6);
                transition: all 0.2s ease;
                z-index: 10000;
                backdrop-filter: blur(8px);
            " onmouseover="this.style.background='rgba(123,111,255,0.4)';this.style.transform='scale(1.1)'" onmouseout="this.style.background='rgba(20,20,30,0.92)';this.style.transform='scale(1)'">✕</button>
        </div>

    <!-- Patch window.open BEFORE games.js so every call is intercepted -->
    <script>
        window.open = function(url, target, features) {
            const overlay = document.getElementById('game-overlay');
            const frame = document.getElementById('game-frame');

            if (!url || url === '' || url === 'about:blank' || url.startsWith('about:')) {
                // games.js will write HTML into the returned window object
                const fakeDoc = {
                    _chunks: [],
                    write(s)   { fakeDoc._chunks.push(s); },
                    writeln(s) { fakeDoc._chunks.push(s + '\n'); },
                    close()    {
                        frame.removeAttribute('src');
                        frame.srcdoc = fakeDoc._chunks.join('');
                        overlay.style.display = 'flex';
                    },
                    open() {},
                    get title()  { return 'New Tab'; },
                    set title(v) {},
                    getElementById()  { return null; },
                    querySelector()   { return null; },
                    createElement(t)  { return document.createElement(t); },
                    body: { appendChild() {} },
                    head: { appendChild() {} },
                };
                return {
                    document: fakeDoc,
                    focus() {},
                    close() {},
                    location: {
                        replace(u) { frame.removeAttribute('srcdoc'); frame.src = u; overlay.style.display = 'flex'; },
                        assign(u)  { frame.removeAttribute('srcdoc'); frame.src = u; overlay.style.display = 'flex'; },
                        href: ''
                    }
                };
            }

            // Real URL — load directly in overlay
            frame.removeAttribute('srcdoc');
            frame.src = url;
            overlay.style.display = 'flex';
            return null;
        };
    </script>

    <script src="https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/games.js"></script>
    <script>
        function processAll() {
            // Convert input[type=button] → <button> so text can wrap properly
            document.querySelectorAll('input[type="button"]').forEach(inp => {
                const btn = document.createElement('button');
                btn.textContent = /^cl/i.test(inp.value) ? inp.value.slice(2) : inp.value;
                btn.onclick = inp.onclick;
                for (const attr of inp.attributes) {
                    if (!['type','value'].includes(attr.name)) btn.setAttribute(attr.name, attr.value);
                }
                inp.parentNode.replaceChild(btn, inp);
            });
            // Update count
            const count = document.querySelectorAll('.buttons-container button').length;
            const el = document.getElementById('game-count-text');
            if (el && count > 0) el.textContent = count.toLocaleString() + ' games available';
        }

        processAll();
        let obsTimer;
        const obs = new MutationObserver(() => {
            clearTimeout(obsTimer);
            obsTimer = setTimeout(processAll, 150);
        });
        obs.observe(document.getElementById('sections-container'), { childList: true, subtree: true, attributes: false });

        document.getElementById('overlay-close').addEventListener('click', function() {
            document.getElementById('game-overlay').style.display = 'none';
            const frame = document.getElementById('game-frame');
            frame.removeAttribute('srcdoc');
            frame.src = 'about:blank';
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') document.getElementById('overlay-close').click();
        });
    </script>
</body>
</html>

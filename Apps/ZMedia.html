<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZMedia Player</title>
<style>
  :root{--bg:#121212;--surface:#181818;--hover:#282828;--primary:#1DB954;--text:#fff;--sub:#a7a7a7;--border:#333;--sidebar-w:340px}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:16px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:linear-gradient(180deg,rgba(18,18,18,.98),var(--bg));z-index:20}
  .logo{font-size:22px;font-weight:800;color:var(--primary);letter-spacing:-0.5px}
  select{background:#242424;color:var(--text);border:1px solid var(--border);border-radius:16px;padding:6px 12px;font-size:13px;cursor:pointer;outline:none}
  select:hover{border-color:var(--primary)}
  .search-wrap{flex:1;max-width:500px;position:relative}
  .search-wrap input{width:100%;padding:10px 16px;border-radius:20px;border:none;background:#242424;color:var(--text);font-size:14px;outline:none}
  .search-wrap input:focus{background:#333;box-shadow:0 0 0 2px var(--primary)}
  .search-wrap input::placeholder{color:var(--sub)}
  .nav-btn{background:none;border:1px solid var(--border);border-radius:20px;padding:6px 14px;color:var(--sub);font-size:13px;cursor:pointer;transition:all .2s;display:none}
  .nav-btn.visible{display:block}
  .nav-btn:hover{border-color:var(--primary);color:var(--text)}
  .nav-btn.upload-active{border-color:var(--primary);color:var(--primary)}
  .inline-btn{background:none;border:1px solid var(--border);border-radius:20px;padding:6px 14px;color:var(--sub);font-size:13px;cursor:pointer;transition:all .2s}
  .inline-btn:hover{border-color:var(--primary);color:var(--text)}
  .upload-toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#222;border:1px solid var(--border);border-radius:20px;padding:8px 18px;font-size:13px;color:var(--text);z-index:100;opacity:0;transition:opacity .3s;pointer-events:none}
  .upload-toast.show{opacity:1}
  main{flex:1;padding:20px 24px 100px;transition:margin-right .3s}
  main.shifted{margin-right:var(--sidebar-w)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
  .card{background:var(--surface);border-radius:8px;padding:14px;cursor:pointer;transition:background .2s;position:relative}
  .card:hover{background:var(--hover)}
  .card-icon{width:54px;height:54px;background:linear-gradient(135deg,#222,#1a1a1a);border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;box-shadow:0 4px 12px rgba(0,0,0,.4);overflow:hidden}
  .card-icon img{width:100%;height:100%;object-fit:cover}
  .card-icon svg{width:26px;height:26px;fill:var(--primary)}
  .card-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-sub{font-size:11px;color:var(--sub);margin-top:4px}
  .card-add{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);border:none;border-radius:50%;width:26px;height:26px;cursor:pointer;display:none;align-items:center;justify-content:center}
  .card:hover .card-add{display:flex}
  .card-add:hover{background:var(--primary)}
  .card-add svg{width:14px;height:14px;fill:#fff}
  .card-save{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.75);border:1px solid var(--border);border-radius:12px;padding:3px 8px;font-size:10px;color:var(--sub);cursor:pointer;display:none;align-items:center;gap:4px;transition:all .2s;white-space:nowrap}
  .card:hover .card-save{display:flex}
  .card-save:hover{background:var(--primary);color:#000;border-color:var(--primary)}
  .sidebar{position:fixed;top:0;right:calc(var(--sidebar-w)*-1);width:var(--sidebar-w);height:100%;background:#151515;border-left:1px solid var(--border);z-index:40;transition:right .3s;display:flex;flex-direction:column}
  .sidebar.open{right:0}
  .sb-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .sb-close{background:none;border:none;color:var(--sub);cursor:pointer;display:flex}
  .sb-title{font-size:16px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sb-list{flex:1;overflow-y:auto;padding:8px}
  .sb-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;transition:background .15s}
  .sb-item:hover{background:var(--hover)}
  .sb-item.active{background:var(--hover);border-left:3px solid var(--primary)}
  .sb-num{font-size:12px;color:var(--sub);width:20px;text-align:center}
  .sb-info{flex:1;min-width:0}
  .sb-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sb-ext{font-size:10px;color:var(--sub)}
  .sb-del{background:none;border:none;color:var(--sub);cursor:pointer;padding:4px;opacity:0;transition:opacity .2s}
  .sb-item:hover .sb-del{opacity:1}
  .sb-footer{padding:12px;border-top:1px solid var(--border);position:relative}
  .sb-add-btn{width:100%;padding:10px;background:var(--primary);border:none;border-radius:20px;color:#000;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
  .sb-add-btn:hover{background:#1ed760}
  .sb-dropdown{position:absolute;bottom:calc(100% + 6px);left:8px;right:8px;max-height:220px;overflow-y:auto;background:#222;border:1px solid var(--border);border-radius:8px;display:none;box-shadow:0 -4px 16px rgba(0,0,0,.4)}
  .sb-dropdown.show{display:block}
  .sb-dd-item{padding:8px 12px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px}
  .sb-dd-item:hover{background:var(--hover)}
  .sb-dd-item.disabled{color:var(--sub);cursor:default;pointer-events:none}
  .player{position:fixed;bottom:0;left:0;right:0;background:#181818;border-top:1px solid #282828;padding:10px 16px;display:flex;align-items:center;gap:12px;z-index:30;transition:right .3s}
  .player.shifted{right:0}
  .p-info{min-width:0;max-width:140px}
  .p-title{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .p-ctx{font-size:10px;color:var(--sub)}
  .controls{display:flex;align-items:center;gap:10px;flex:1;justify-content:center}
  .btn{background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--sub);padding:4px;transition:color .2s}
  .btn svg{width:18px;height:18px;fill:currentColor}
  .btn:hover{color:var(--text)}
  .btn.active{color:var(--primary)}
  .btn-play{width:32px;height:32px;border-radius:50%;background:#fff}
  .btn-play svg{fill:#000;width:14px;height:14px}
  .vol-wrap{display:flex;align-items:center;gap:6px;min-width:140px}
  .vol-wrap svg{width:14px;height:14px;fill:var(--sub)}
  .vol-slider-wrap{position:relative;flex:1;display:flex;align-items:center}
  .vol-snap-line{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:2px;height:10px;background:var(--primary);opacity:0.5;border-radius:1px;pointer-events:none}
  .vol-wrap input[type=range]{width:100%;accent-color:var(--primary);height:3px;cursor:pointer}
  .prog-wrap{flex:1;max-width:360px;display:flex;align-items:center;gap:6px}
  .prog-wrap span{font-size:10px;color:var(--sub);min-width:28px;text-align:center}
  .prog-bar{flex:1;height:3px;background:#404040;border-radius:2px;cursor:pointer}
  .prog-fill{height:100%;background:var(--primary);border-radius:2px;width:0}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(2px)}
  .modal.open{display:flex}
  .modal-box{background:#1a1a1a;border:1px solid var(--border);border-radius:12px;padding:20px;max-width:380px;width:100%}
  .modal-title{font-size:16px;font-weight:700;margin-bottom:14px}
  .modal-input{width:100%;padding:10px 12px;background:#2a2a2a;border:1px solid #333;border-radius:6px;color:#fff;font-size:14px;outline:none;margin-bottom:10px}
  .modal-btns{display:flex;gap:10px;justify-content:flex-end}
  .m-btn{padding:8px 16px;border-radius:16px;border:none;font-size:13px;font-weight:600;cursor:pointer}
  .m-btn.p{background:var(--primary);color:#000}
  .m-btn.g{background:transparent;color:var(--sub);border:1px solid var(--border)}
  .pl-list{max-height:200px;overflow-y:auto;margin-bottom:12px}
  .pl-row{padding:10px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
  .pl-row:hover{background:var(--hover)}
  .pl-row .del{background:none;border:none;color:var(--sub);cursor:pointer;opacity:0;transition:opacity .2s}
  .pl-row:hover .del{opacity:1}
  .empty{text-align:center;padding:50px 20px;color:var(--sub);font-size:14px}
  .loading{text-align:center;padding:40px;color:var(--sub);font-size:14px;grid-column:1/-1}
  .dropdown{position:fixed;background:#222;border:1px solid var(--border);border-radius:8px;padding:4px;z-index:60;display:none;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  .dropdown.show{display:block}
  .dd-item{padding:8px 12px;font-size:13px;cursor:pointer;display:flex;gap:8px}
  .dd-item:hover{background:var(--hover)}
  .dd-item.disabled{color:var(--sub);pointer-events:none}
  .card-badge{display:inline-block;font-size:9px;font-weight:700;padding:2px 5px;border-radius:4px;margin-top:4px;letter-spacing:.5px}
  .badge-live{background:#e22;color:#fff}
  .badge-kbps{background:#333;color:var(--sub)}
  .live-dot{width:8px;height:8px;border-radius:50%;background:#e22;display:inline-block;margin-right:5px;animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .prog-wrap.hidden{visibility:hidden}
  @media(max-width:600px){header{padding:12px;gap:8px;flex-wrap:wrap}.search-wrap{order:3;min-width:100%}main{padding:12px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}.player{flex-wrap:wrap;gap:6px;padding:8px 12px}.prog-wrap{order:10;width:100%;max-width:100%}.vol-wrap{display:none}.player.shifted{right:0}main.shifted{margin-right:0}.sidebar{width:100%;right:-100%}.sidebar.open{right:0}}
  .video-modal-box{background:#1a1a1a;border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
  .video-modal-header{padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0}
  .video-modal-title{font-size:14px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .video-modal-sub{font-size:11px;color:var(--sub);white-space:nowrap}
  .video-modal-close{background:none;border:none;color:var(--sub);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px}
  .video-modal-close:hover{color:var(--text)}
  /* Player picker dropdown */
  .vm-player-pick{position:relative;flex-shrink:0;margin-left:auto}
  .vm-pick-btn{display:flex;align-items:center;gap:5px;background:#2a2a2a;border:1px solid var(--border);border-radius:10px;padding:4px 10px;font-size:11px;font-weight:700;color:var(--sub);cursor:pointer;white-space:nowrap;user-select:none;transition:border-color .15s,color .15s}
  .vm-pick-btn:hover{border-color:#ff6b6b;color:var(--text)}
  .vm-pick-btn svg{opacity:.6;flex-shrink:0}
  .vm-pick-menu{display:none;position:absolute;right:0;top:calc(100% + 6px);background:#1e1e1e;border:1px solid var(--border);border-radius:10px;min-width:165px;z-index:999;overflow:hidden;box-shadow:0 4px 20px #0008}
  .vm-pick-menu.open{display:block}
  .vm-pick-opt{padding:9px 14px;font-size:12px;font-weight:600;color:var(--sub);cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .15s,color .15s}
  .vm-pick-opt:hover{background:#2a2020;color:var(--text)}
  .vm-pick-opt.active{color:#ffb3b3;background:#2c1a1a}
  .vm-pick-tag{font-size:9px;font-weight:700;background:#2a2a2a;border:1px solid var(--border);border-radius:5px;padding:1px 5px;color:var(--sub);margin-left:auto}
  .vm-invidious-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;width:100%;height:100%;background:#0f0f0f;color:var(--sub);font-size:13px;text-align:center;padding:24px}
  .vm-invidious-placeholder svg{opacity:.5}
  .vm-invidious-placeholder strong{color:var(--text);font-size:15px}
  .vm-invidious-placeholder a{color:#ff6b6b;text-decoration:none;font-weight:700;padding:8px 18px;border:1px solid #ff6b6b;border-radius:20px;font-size:13px;transition:background .15s,color .15s}
  .vm-invidious-placeholder a:hover{background:#ff6b6b;color:#fff}
  .video-iframe-wrap{position:relative;width:100%;flex-shrink:0;background:#000}
  .video-iframe-wrap iframe{display:block;width:100%;height:100%;background:#000;border:none}
  .video-badge{display:inline-block;font-size:9px;font-weight:700;padding:2px 5px;border-radius:4px;margin-top:4px;letter-spacing:.5px;background:#1a3a5c;color:#6ab4ff}
  .badge-archive-v{background:#2a1a3a;color:#c084fc}
  .badge-peertube{background:#1a3a1a;color:#4ade80}
  .badge-ted{background:#3a1a1a;color:#f87171}
  .badge-vimeo{background:#1a2a3a;color:#60a5fa}
  .badge-wikimedia-a{background:#2a2a1a;color:#fbbf24}
  .ng-box{background:#1a1a1a;border:1px solid var(--border);border-radius:12px;width:min(480px,94vw);padding:20px;display:flex;flex-direction:column;gap:10px}
  .ng-header{display:flex;align-items:center;justify-content:space-between}
  .ng-title{font-size:15px;font-weight:700}
  .ng-hint{font-size:12px;color:var(--sub);line-height:1.6;margin:0}
  .ng-hint code{background:var(--card);padding:1px 4px;border-radius:3px;font-size:11px}
  .ng-row{display:flex;gap:8px;align-items:center}
  .badge-wikimedia{background:#2a2a1a;color:#fbbf24}
  .badge-nasa{background:#1a1a3a;color:#a78bfa}
  .badge-mixcloud{background:#1a1a2e;color:#67e8f9}
  .badge-youtube{background:#3a1a1a;color:#ff6b6b}
  .channel-strip{grid-column:1/-1;display:flex;gap:12px;overflow-x:auto;padding:0 0 8px}
  .channel-card{min-width:260px;background:linear-gradient(135deg,#201515,#181818);border:1px solid var(--border);border-radius:8px;padding:12px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:background .2s,border-color .2s}
  .channel-card:hover{background:#242020;border-color:#ff6b6b}
  .channel-avatar{width:56px;height:56px;border-radius:50%;background:#222;object-fit:cover;flex-shrink:0}
  .channel-info{min-width:0;flex:1}
  .channel-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .channel-meta{font-size:11px;color:var(--sub);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .channel-desc{font-size:11px;color:var(--sub);margin-top:6px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .channel-body>.channel-desc{font-size:13px;display:block;-webkit-line-clamp:unset;white-space:pre-wrap;overflow:visible}
  .channel-modal-box{background:#1a1a1a;border:1px solid var(--border);border-radius:12px;width:min(940px,96vw);max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
  .channel-body{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px;min-height:0}
  .channel-hero{display:flex;gap:14px;align-items:flex-start}
  .channel-hero .channel-avatar{width:72px;height:72px}
  .channel-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .channel-actions a{text-decoration:none}
  .channel-tabs{display:flex;gap:8px;border-bottom:1px solid var(--border);padding-bottom:10px;align-items:center;flex-shrink:0;flex-wrap:nowrap;min-height:0}
  .channel-tabs-btns{display:flex;gap:8px;overflow-x:auto;flex-shrink:0}
  .channel-tab{background:#242424;border:1px solid var(--border);border-radius:18px;color:var(--sub);padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .2s}
  .channel-tab:hover{border-color:#ff6b6b;color:var(--text)}
  .channel-tab.active{background:#3a1a1a;border-color:#ff6b6b;color:#ffb3b3}
  .channel-search-wrap{flex:1;min-width:0;max-width:220px;margin-left:auto;position:relative}
  .channel-search-wrap input{width:100%;padding:7px 12px 7px 30px;border-radius:18px;border:1px solid var(--border);background:#242424;color:var(--text);font-size:13px;outline:none;transition:border-color .2s}
  .channel-search-wrap input:focus{border-color:#ff6b6b;background:#2c2020}
  .channel-search-wrap input::placeholder{color:var(--sub)}
  .channel-search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;fill:var(--sub);pointer-events:none}
  .channel-section{border-top:1px solid var(--border);padding-top:14px}
  .channel-panel{display:none}
  .channel-panel.active{display:block}
  .channel-section-title{font-size:13px;font-weight:800;margin-bottom:10px;color:var(--text)}
  .channel-mini-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .channel-status{font-size:12px;color:var(--sub);padding:12px 2px}
  .channel-mini-card{background:var(--surface);border-radius:8px;padding:8px;cursor:pointer;transition:background .2s}
  .channel-mini-card:hover{background:var(--hover)}
  .channel-mini-thumb{width:100%;aspect-ratio:16/9;background:#0b0b0b;border-radius:6px;overflow:hidden;margin-bottom:8px;display:flex;align-items:center;justify-content:center}
  .channel-mini-thumb img{width:100%;height:100%;object-fit:cover}
  .channel-post{background:var(--surface);border-radius:8px;padding:12px;margin-bottom:10px}
  .channel-post-text{font-size:13px;line-height:1.45;white-space:pre-wrap}
  .channel-post-meta{font-size:11px;color:var(--sub);margin-top:8px}
  .channel-post-media{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
  .channel-post-media img{max-width:170px;border-radius:6px;border:1px solid var(--border)}
</style>
</head>
<body>
<header>
  <div class="logo">ZMedia</div>
  <select id="apiSelect">
    <option value="online" selected>Music</option>
    <option value="local">Local</option>
    <option value="radio">Radio</option>
    <option value="video">Videos</option>
    <option value="podcast">Podcasts</option>
  </select>
  <div class="search-wrap"><input type="text" id="searchInput" placeholder="Search tracks..."></div>
  <button class="inline-btn" id="ngBtn" style="display:none">Newgrounds</button>
  <button class="nav-btn" id="uploadBtn">Import</button>
  <input type="file" id="fileInput" accept="audio/*,video/mp4,video/webm,video/ogg,video/quicktime,video/x-matroska,.mkv,.mp4,.webm,.mov,.m4a,.3gp,.3g2" multiple style="display:none">
  <button class="nav-btn" id="plBtn">Playlists</button>
</header>
<main id="main"><div class="grid" id="grid"><div class="loading">Loading tracks...</div></div></main>

<div class="sidebar" id="sidebar">
  <div class="sb-header">
    <button class="sb-close" id="sbClose"><svg width="18" height="18" viewBox="0 0 24 24" fill="var(--sub)"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
    <div class="sb-title" id="sbTitle">Playlist</div>
  </div>
  <div class="sb-list" id="sbList"></div>
  <div class="sb-footer">
    <button class="sb-add-btn" id="sbAddBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="#000"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg> Add Song</button>
    <div class="sb-dropdown" id="sbDropdown"></div>
  </div>
</div>

<div class="modal" id="plModal">
  <div class="modal-box">
    <div class="modal-title">Your Playlists</div>
    <div class="pl-list" id="plList"></div>
    <input class="modal-input" id="newPlInput" placeholder="New playlist name...">
    <div class="modal-btns"><button class="m-btn g" id="closePl">Cancel</button><button class="m-btn p" id="createPl">Create</button></div>
  </div>
</div>

<div class="player" id="player" style="display:none">
  <div class="p-info">
    <div class="p-title" id="pTitle"></div>
    <div class="p-ctx" id="pCtx"></div>
  </div>
  <div class="controls">
    <button class="btn" id="prevBtn"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>

// ── IndexedDB helpers ──────────────────────────────────────────────────────
const DB_NAME='ZMusicDB',DB_VERSION=1,STORE='tracks';
let db=null;
function openDB(){
  return new Promise((res,rej)=>{
    if(db)return res(db);
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=e=>{e.target.result.createObjectStore(STORE,{keyPath:'name'})};
    req.onsuccess=e=>{db=e.target.result;res(db)};
    req.onerror=()=>rej(req.error);
  });
}
function dbGetAll(){
  return openDB().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction(STORE,'readonly');
    const req=tx.objectStore(STORE).getAll();
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>rej(req.error);
  }));
}
function dbPut(record){
  return openDB().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction(STORE,'readwrite');
    const req=tx.objectStore(STORE).put(record);
    req.onsuccess=()=>res();
    req.onerror=()=>rej(req.error);
  }));
}
function dbDelete(name){
  return openDB().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction(STORE,'readwrite');
    const req=tx.objectStore(STORE).delete(name);
    req.onsuccess=()=>res();
    req.onerror=()=>rej(req.error);
  }));
}

// ── Save to Local helper ───────────────────────────────────────────────────
async function saveToLocal(t,btnEl){
  if(!t.url){toast('No direct URL to save');return}
  if(btnEl){btnEl.textContent='Saving…';btnEl.style.pointerEvents='none'}
  try{
    const res=await fetch(t.url);
    if(!res.ok)throw new Error('Fetch failed');
    const buf=await res.arrayBuffer();
    const ext=t.url.split('?')[0].match(/\.[a-z0-9]+$/i)?.[0]||'.mp3';
    const safeName=(t.name||'track').replace(/[/\\:*?"<>|]/g,'_').slice(0,80)+ext;
    const blob=new Blob([buf],{type:res.headers.get('content-type')||'audio/mpeg'});
    await dbPut({name:safeName,blob});
    toast(`Saved "${t.name}" to Local`);
    if(btnEl){btnEl.textContent='✓ Saved';btnEl.style.color='var(--primary)'}
  }catch(e){
    toast('Could not save — track may be protected');
    if(btnEl){btnEl.textContent='Save to Local';btnEl.style.pointerEvents=''}
  }
}
let toastT;
function toast(msg){
  uploadToast.textContent=msg;uploadToast.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>uploadToast.classList.remove('show'),2500);
}

// ── Native: load from IndexedDB ────────────────────────────────────────────
async function fetchNative(){
  const rows=await dbGetAll();
  return rows.map(r=>{
    if(r.ngId){
      // Newgrounds reference — no blob, play via CDN URL
      return{
        name:r.ngName||`Newgrounds #${r.ngId}`,
        file:r.name,
        isNative:true,isLocal:true,isNGRef:true,
        ngId:r.ngId,ngName:r.ngName,
        blob:null
      };
    }
    return{
      name:r.name.replace(/\.[^.]+$/,''),
      file:r.name,
      isNative:true,isLocal:true,
      isLocalVideo:/\.(mp4|webm|mov|mkv|avi)$/i.test(r.name),
      blob:r.blob
    };
  });
}

// ── Upload handler ─────────────────────────────────────────────────────────
uploadBtn.onclick=()=>fileInput.click();
fileInput.onchange=async()=>{
  const files=[...fileInput.files].filter(f=>/\.(mp3|wav|ogg|m4a|aac|flac|webm|mp4|mov|mkv|avi|3gp|3g2)$/i.test(f.name));
  if(!files.length){toast('No supported audio/video files selected');return}
  uploadBtn.classList.add('upload-active');
  uploadBtn.textContent='Uploading…';
  let added=0;
  for(const f of files){
    const buf=await f.arrayBuffer();
    await dbPut({name:f.name,blob:new Blob([buf],{type:f.type||'audio/mpeg'})});
    added++;
  }
  fileInput.value='';
  uploadBtn.textContent='Upload';
  uploadBtn.classList.remove('upload-active');
  toast(`Added ${added} file${added!==1?'s':''}`);
  if(currentApi==='local'){tracks=await fetchNative();renderGrid()}
};

// ── ccMixter — CC remix community, full tracks, no key ────────────────────
async function fetchCCMixter(q){
  // Returns JSONP-style array; f=json gives raw JSON array
  const res=await fetch(`https://ccmixter.org/api/query?search=${encodeURIComponent(q)}&format=json&limit=20&type=any`,{cache:'no-store'});
  if(!res.ok) throw null;
  let text=await res.text();
  // ccMixter JSON can have bad octals — strip them safely
  text=text.replace(/\\[0-7]{3}/g,'');
  const data=JSON.parse(text);
  return (Array.isArray(data)?data:[]).filter(t=>{
    const mp3=t.files?.find?.(f=>f.download_url&&/\.mp3$/i.test(f.download_url));
    return mp3;
  }).map(t=>{
    const mp3=t.files.find(f=>f.download_url&&/\.mp3$/i.test(f.download_url));
    return{
      id:t.upload_id,
      name:t.upload_name||'Unknown',
      artist:t.user_real_name||t.user_name||'',
      url:mp3.download_url,
      art:'',
      provider:'ccMixter',isNative:false
    };
  });
}

// ── Internet Archive — public domain & CC audio, no key ───────────────────
async function fetchArchive(q){
  const url=`https://archive.org/advancedsearch.php?q=${encodeURIComponent(q)}+AND+mediatype:audio&fl[]=identifier,title,creator&rows=12&output=json`;
  const res=await fetch(url,{cache:'no-store'});
  if(!res.ok) throw null;
  const d=await res.json();
  const items=d.response?.docs||[];
  // Return items immediately; actual audio URL is resolved lazily in playArchive()
  return items.map(it=>({
    id:it.identifier,
    name:it.title||it.identifier,
    artist:Array.isArray(it.creator)?it.creator[0]:it.creator||'Internet Archive',
    url:null, // resolved at play time
    art:`https://archive.org/services/get-item-image.php?identifier=${it.identifier}`,
    provider:'Archive',isNative:false,isArchive:true
  }));
}

// Resolve the real audio file URL for an Archive item on demand
async function resolveArchiveUrl(t){
  if(t.url)return t.url;
  const meta=await fetch(`https://archive.org/metadata/${t.id}`,{cache:'no-store'});
  if(!meta.ok)throw new Error('Archive metadata failed');
  const m=await meta.json();
  const files=m.files||[];
  const pick=files.find(f=>/\.mp3$/i.test(f.name))||
             files.find(f=>/\.ogg$/i.test(f.name))||
             files.find(f=>/\.(opus|flac|m4a|wav)$/i.test(f.name));
  if(!pick)throw new Error('No audio file found');
  const server=m.server||'ia803400.us.archive.org';
  const dir=m.dir||`/0/items/${t.id}`;
  t.url=`https://${server}${dir}/${encodeURIComponent(pick.name)}`;
  return t.url;
}

async function fetchWikimediaAudio(q){

  const res=await fetch(url,{cache:'no-store'});
  if(!res.ok)throw null;
  const d=await res.json();
  const pages=Object.values(d.query?.pages||{});
  return pages.filter(p=>{

    return /^audio\//.test(mime)||/\.(mp3|ogg|flac|wav|oga)$/i.test(p.imageinfo?.[0]?.url||'');
  }).map(p=>{

// ── RadioBrowser — global radio stations, no key ───────────────────────────
// Use the stable anycast DNS-resolved mirror
const RB='https://de1.api.radio-browser.info';
async function fetchRadio(q){
  // Search by name and tag simultaneously, deduplicate by stationuuid
  const params=`hidebroken=true&lastcheckok=1&limit=60&order=clickcount&reverse=true`;
  const byName=fetch(`${RB}/json/stations/search?name=${encodeURIComponent(q)}&${params}`,{headers:{'User-Agent':'ZMusic/1.0'},cache:'no-store'}).then(r=>r.json()).catch(()=>[]);
  const byTag =fetch(`${RB}/json/stations/search?tag=${encodeURIComponent(q)}&${params}`,{headers:{'User-Agent':'ZMusic/1.0'},cache:'no-store'}).then(r=>r.json()).catch(()=>[]);
  const [names,tags]=await Promise.all([byName,byTag]);
  const seen=new Set();
  return [...names,...tags].filter(s=>{
    if(!s.url_resolved&&!s.url)return false;
    if(seen.has(s.stationuuid))return false;
    seen.add(s.stationuuid);
    return true;
  }).map(s=>({
    id:s.stationuuid,
    name:s.name||'Unknown Station',
    artist:s.country||'',
    url:s.url_resolved||s.url,
    art:s.favicon||'',
    tags:s.tags||'',
    bitrate:s.bitrate||0,
    codec:s.codec||'',
    provider:'Radio',isNative:false,isRadio:true
  }));
}

function escapeHtml(v){
  return String(v??'').replace(/[&<>"']/g,ch=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[ch]);
}

function compactDuration(seconds){
  seconds=Number(seconds);
  if(!seconds||!isFinite(seconds))return '';
  const h=Math.floor(seconds/3600);
  const m=Math.floor((seconds%3600)/60);
  const s=Math.floor(seconds%60);
  return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`;
}

function compactNumber(n){
  n=Number(n);
  if(!n||!isFinite(n))return '';
  if(n>=1e9)return `${(n/1e9).toFixed(n>=1e10?0:1)}B`;
  if(n>=1e6)return `${(n/1e6).toFixed(n>=1e7?0:1)}M`;
  if(n>=1e3)return `${(n/1e3).toFixed(n>=1e4?0:1)}K`;
  return String(n);
}

async function getInvidiousInstances(){
  if(invidiousInstancesCache)return invidiousInstancesCache;
  const found=[];
  try{
    const res=await fetch('https://api.invidious.io/instances.json',{cache:'no-store'});
    if(res.ok){
      const rows=await res.json();
      found.push(...(Array.isArray(rows)?rows:[])
        .map(row=>row?.[1])
        .filter(info=>info?.uri&&info.type==='https'&&info.api!==false&&info.cors!==false&&info.monitor?.down!==true)
        .sort((a,b)=>(b.monitor?.uptime||0)-(a.monitor?.uptime||0))
        .map(info=>info.uri.replace(/\/$/,'')));
    }
  }catch(e){}
  invidiousInstancesCache=[...new Set([...INVIDIOUS_FALLBACK_INSTANCES,...found])];
  return invidiousInstancesCache;
}

function pickInvidiousThumb(thumbnails,instance){
  const list=Array.isArray(thumbnails)?thumbnails:[];
  const pick=list.find(t=>/mqdefault|medium/i.test(t.quality||''))||
             list.find(t=>/hqdefault|high/i.test(t.quality||''))||
             list[list.length-1]||list[0];
  const url=pick?.url||'';
  if(!url)return '';
  if(/^https?:\/\//i.test(url))return url;
  if(url.startsWith('//'))return `https:${url}`;
  if(url.startsWith('/'))return `${instance}${url}`;
  return url;
}

function mapInvidiousVideo(v,instance,provider='YouTube'){
  const duration=compactDuration(v.lengthSeconds);
  return{
    id:v.videoId,

    artist:[v.author||provider,duration||v.publishedText].filter(Boolean).join(' · '),
    description:v.description||'',
    thumb:pickInvidiousThumb(v.videoThumbnails,instance),
    // Use privacy-enhanced nocookie domain — no tracking cookies until play, fewer ads
    embedUrl:`https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.videoId)}?autoplay=1&rel=0`,
    pageUrl:`https://www.youtube.com/watch?v=${encodeURIComponent(v.videoId)}`,
    provider,isVideo:true,isYouTube:true,
    liveNow:!!v.liveNow
  };
}

async function fetchInvidiousJson(path,preferredInstance='',timeout=8000){
  const instances=await getInvidiousInstances();
  const ordered=[...new Set([preferredInstance,...instances].filter(Boolean))];
  for(const instance of ordered){
    try{
      const res=await withTimeout(fetch(`${instance}${path}`,{cache:'no-store'}),timeout);
      if(!res.ok)continue;
      return {data:await res.json(),instance};
    }catch(e){}
  }
  throw new Error('Invidious request failed');
}

// ── Wikimedia Commons — public domain / CC video via MediaWiki API ─────────
async function fetchWikimediaVideo(q){
  const url=`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrnamespace=6&gsrlimit=20&prop=imageinfo|pageimages&iiprop=url|mime|extmetadata&iiextmetadatafilter=License,LicenseShortName,ImageDescription&pithumbsize=360&format=json&origin=*`;
  const res=await fetch(url,{cache:'no-store'});
  if(!res.ok)throw null;
  const d=await res.json();
  const pages=Object.values(d.query?.pages||{});
  return pages.filter(p=>{
    const mime=p.imageinfo?.[0]?.mime||'';
    return /^video\//.test(mime);
  }).map(p=>{
    const ii=p.imageinfo?.[0]||{};
    const title=p.title?.replace(/^File:/,'');
    const desc=ii.extmetadata?.ImageDescription?.value?.replace(/<[^>]+>/g,'')||'';
    return{
      id:p.pageid,
      name:title?.replace(/\.[^.]+$/,'')||'Unknown',
      artist:'Wikimedia Commons',
      description:desc,
      thumb:p.thumbnail?.source||'',
      embedUrl:`https://commons.wikimedia.org/wiki/File:${encodeURIComponent(title)}?embedplayer=yes`,
      pageUrl:`https://commons.wikimedia.org/wiki/File:${encodeURIComponent(title)}`,
      provider:'Wikimedia',isVideo:true
    };
  });
}

function withTimeout(promise,ms){
  return Promise.race([
    promise,
    new Promise((_,rej)=>setTimeout(()=>rej(new Error('Timed out')),ms))
  ]);
}

function addUniqueVideos(target,items,seen){
  for(const v of (Array.isArray(items)?items:[])){
    const key=`${v.provider||''}:${v.id||v.embedUrl||v.pageUrl||v.name}`;
    if(seen.has(key))continue;
    seen.add(key);
    target.push(v);
  }
}

async function fetchVideoAll(q,onUpdate,isCurrent){
  const all=[];
  const seen=new Set();
  for(const provider of VIDEO_PROVIDERS){
    if(isCurrent&&!isCurrent())return all;
    if(onUpdate)onUpdate(all,`Searching ${provider.label}...`);
    try{
      const items=await withTimeout(provider.fetcher(q),provider.timeout||VIDEO_PROVIDER_TIMEOUT);
      if(isCurrent&&!isCurrent())return all;
      addUniqueVideos(all,items,seen);
      if(onUpdate)onUpdate(all,`Loaded ${provider.label}`);
    }catch(e){
      if(onUpdate)onUpdate(all,`Skipped ${provider.label}`);
      console.warn(`${provider.label} video search failed`,e);
    }
  }
  return all;
}

$('#ngPlayBtn').onclick=async()=>{
  const id=$('#ngIdInput').value.trim();
  const nameRaw=$('#ngNameInput').value.trim();
  if(!id||isNaN(id)){ngStatus.textContent='Please enter a valid song ID.';return}
  if(!nameRaw){ngStatus.textContent='Please enter the song name too.';return}

  const saveBtn=$('#ngSaveBtn');
  saveBtn.textContent='⬇ Save to Local';
  saveBtn.style.color='';
  saveBtn.style.pointerEvents='';
  saveBtn.dataset.ngid=id;
  saveBtn.dataset.ngtitle=nameRaw;

  // Build the CDN URL using NG's known pattern:
  // https://audio.ngfiles.com/{floor(id/1000)*1000}/{id}_{sanitized_name_max26}.mp3
  // Sanitization: keep alphanumeric, hyphen, underscore; replace spaces with dashes; strip rest; max 26 chars
  const folder=Math.floor(parseInt(id)/1000)*1000;
  const base=`https://audio.ngfiles.com/${folder}/${id}`;

  // NG sanitization (from AutoHotkey GD downloader source):
  // spaces→dash, &→amp, <→lt, >→gt, "→quot, everything else non-word/dash deleted, max 26
  const ngSanitize=(s,max=26)=>s
    .replace(/&/g,'amp').replace(/</g,'lt').replace(/>/g,'gt').replace(/"/g,'quot')
    .replace(/\s+/g,'-')
    .replace(/[^\w-]/g,'')
    .slice(0,max);

  // Underscore variant (spaces→underscore, strip non-alphanum/underscore)
  const ngUnderscore=(s,max=26)=>s
    .replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_]/g,'').slice(0,max);

  // First 6 lowercase alphanumeric chars
  const slug6=nameRaw.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,6);

  const san26=ngSanitize(nameRaw,26);
  const sanFull=ngSanitize(nameRaw,999);
  const und26=ngUnderscore(nameRaw,26);
  const undFull=ngUnderscore(nameRaw,999);

  const variants=[
    // Dash-separated variants (AutoHotkey/GD downloader confirmed)
    `${base}_${san26}.mp3`,
    `${base}_${ngSanitize(nameRaw,28)}.mp3`,
    `${base}_${ngSanitize(nameRaw,30)}.mp3`,
    `${base}_${ngSanitize(nameRaw,32)}.mp3`,
    `${base}_${sanFull}.mp3`,
    // Underscore variants (user confirmed: At_the_Speed_of_Light_FINA)
    `${base}_${und26}.mp3`,
    `${base}_${ngUnderscore(nameRaw,28)}.mp3`,
    `${base}_${ngUnderscore(nameRaw,30)}.mp3`,
    `${base}_${ngUnderscore(nameRaw,32)}.mp3`,
    `${base}_${undFull}.mp3`,
    // newgrounds_ prefix (user confirmed: 32207_newgrounds_forsa)
    `${base}_newgrounds_${slug6}.mp3`,
    // Lowercase dash variants
    `${base}_${san26.toLowerCase()}.mp3`,
    `${base}_${sanFull.toLowerCase()}.mp3`,
    // Lowercase underscore variants
    `${base}_${und26.toLowerCase()}.mp3`,
    `${base}_${undFull.toLowerCase()}.mp3`,
  ];
  const urls=[...new Set(variants)];
  saveBtn.dataset.ngurl=urls[0];

  let ngAudio=document.getElementById('ngAudioEl');
  if(!ngAudio){
    ngAudio=document.createElement('audio');
    ngAudio.id='ngAudioEl';
    ngAudio.controls=true;
    ngAudio.style.cssText='width:100%;border-radius:8px';
    const wrap=document.createElement('div');
    wrap.id='ngAudioWrap';
    wrap.appendChild(ngAudio);
    ngPlayer.insertBefore(wrap,ngPlayer.firstChild);
  }

  let tryIdx=0;
  const tryNext=()=>{
    if(tryIdx>=urls.length){
      ngStatus.textContent=`Couldn't play — double-check the ID and name are correct.`;
      ngPlayer.style.display='none';
      return;
    }
    const u=urls[tryIdx++];
    saveBtn.dataset.ngurl=u;
    ngAudio.src=u;
    ngAudio.load();
  };
  ngAudio.onerror=tryNext;
  ngAudio.oncanplay=()=>{ngAudio.play().catch(()=>{})};
  tryNext();
  ngStatus.textContent=nameRaw;
  ngPlayer.style.display='block';
};

// ── Smart video sizing: shrinks the whole modal box to fit 16:9 ──────────
const videoModalBox=$('.video-modal-box'),videoIframeWrap=$('.video-iframe-wrap');
function fitVideoPlayer(){
  if(!videoModal.classList.contains('open'))return;
  const vw=window.innerWidth,vh=window.innerHeight;
  const maxBoxW=Math.min(860,vw*0.96);
  const headerH=videoModal.querySelector('.video-modal-header').offsetHeight||50;
  // Total space the entire modal can use
  const maxTotalH=vh*0.92;
  const availVideoH=maxTotalH-headerH;
  const availVideoW=maxBoxW;
  // Solve for best 16:9 fit inside availVideoW × availVideoH
  const hFromW=availVideoW*9/16;
  let videoW,videoH;
  if(hFromW<=availVideoH){
    videoW=availVideoW; videoH=hFromW;
  } else {
    videoH=availVideoH; videoW=Math.min(availVideoH*16/9,availVideoW);
  }
  // Set the wrap
  videoIframeWrap.style.width=Math.round(videoW)+'px';
  videoIframeWrap.style.height=Math.round(videoH)+'px';
  videoIframeWrap.style.margin='0 auto';
  // Shrink the box itself so it hugs the content
  videoModalBox.style.width=Math.round(videoW)+'px';

const INVIDIOUS_NO_EMBED=['inv.nadeko.net','inv.thepixora.com'];

function getInvidiousWatchInstance(){
  if(_lastInvidiousEmbedInstance) return _lastInvidiousEmbedInstance;
  if(_lastInvidiousInstance&&!INVIDIOUS_NO_EMBED.some(h=>_lastInvidiousInstance.includes(h)))

function openInvidious(v){

function loadVideoSrc(v){
  // Clear any Invidious placeholder when switching back to native
  videoIframeWrap.querySelectorAll('.vm-invidious-placeholder').forEach(el=>el.remove());

  if(v.blobUrl||v.isNasaVideo){
    videoFrame.style.display='none';
    videoFrame.src='';
    videoEl.style.display='block';
    if(v.blobUrl){
      videoEl.src=v.blobUrl;
    } else {
      videoEl.src=v.embedUrl;
      videoEl.onerror=()=>{
        fetch(`https://images-api.nasa.gov/asset/${v.id}`,{cache:'no-store'})
          .then(r=>r.json()).then(d=>{
            const mp4=(d.collection?.items||[]).find(i=>/\.mp4$/i.test(i.href));
            if(mp4)videoEl.src=mp4.href;
          }).catch(()=>{});
        videoEl.onerror=null;
      };
    }
    videoEl.play().catch(()=>{});
  } else if(v.isYouTube&&_currentPlayer==='invidious'){
    openInvidious(v);
  } else {
    videoEl.style.display='none';
    videoEl.src='';
    videoFrame.style.display='block';
    videoFrame.src=v.isYouTube ? buildNativeYouTubeUrl(v.id) : v.embedUrl;
  }
}

function renderChannelStrip(channels){
  if(!channels?.length)return '';
  return`<div class="channel-strip">${channels.map((ch,i)=>{
    const sub=ch.subCount?`${compactNumber(ch.subCount)} subscribers`:'YouTube channel';
    const vids=ch.videoCount?` · ${compactNumber(ch.videoCount)} videos`:'';
    const avatar=ch.thumb?`<img class="channel-avatar" src="${escapeHtml(ch.thumb)}" alt="">`:`<div class="channel-avatar"></div>`;
    return`<div class="channel-card" data-cidx="${i}">
      ${avatar}
      <div class="channel-info">
        <div class="channel-name">${escapeHtml(ch.name)}</div>
        <div class="channel-meta">${escapeHtml(sub+vids)}</div>
        <div class="channel-desc">${escapeHtml(ch.description||'View channel details, latest videos, livestreams, and community posts.')}</div>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function bindChannelCards(channels){
  $$('.channel-card').forEach(c=>c.onclick=()=>openChannelModal(channels[+c.dataset.cidx]));

function renderChannelVideoCards(el,videos,emptyText){
  const filtered=channelSearchQuery
    ?videos.filter(v=>(v.name||'').toLowerCase().includes(channelSearchQuery)||(v.artist||'').toLowerCase().includes(channelSearchQuery))
    :videos;

  if(!filtered.length){
    const msg=channelSearchQuery&&videos.length?`No results for "${channelSearchQuery}"`:emptyText;
    // Only rewrite if there's something to replace (avoids touching the loading spinner)
    if(!el.querySelector('.channel-mini-card')){
      el.innerHTML=`<div class="empty" style="padding:18px">${escapeHtml(msg)}</div>`;
    }
    return;
  }

  // Count how many cards are already rendered
  const existing=el.querySelectorAll('.channel-mini-card').length;

  // If search is active, we need a full redraw (filter changes the set)
  if(channelSearchQuery){
    el.innerHTML='';
  }

  const startIdx=channelSearchQuery?0:existing;
  const newItems=filtered.slice(startIdx);
  if(!newItems.length)return;

  const fragment=document.createDocumentFragment();
  newItems.forEach((v,offset)=>{
    const i=startIdx+offset;
    const thumb=v.thumb?`<img src="${escapeHtml(v.thumb)}" alt="">`:'';
    const div=document.createElement('div');
    div.className='channel-mini-card';
    div.dataset.vidx=i;
    div.innerHTML=`<div class="channel-mini-thumb">${thumb}</div>
      <div class="card-title">${escapeHtml(v.name)}</div>
      <div class="card-sub">${escapeHtml(v.artist||'')}</div>`;
    div.onclick=()=>{closeChannelModal();openVideoModal(filtered[+div.dataset.vidx]);};
    fragment.appendChild(div);
  });
  el.appendChild(fragment);

  // Remove empty placeholder if cards are now present
  el.querySelectorAll('.empty').forEach(e=>e.remove());
}

function renderChannelPosts(posts,instance){
  channelPostVideos=[];
  const rows=Array.isArray(posts)?posts:[];
  if(!rows.length){channelPosts.innerHTML='<div class="empty" style="padding:18px">No community posts found</div>';return}
  channelPosts.innerHTML=rows.map(post=>{
    const attachments=[];
    const attach=post.attachment;
    if(attach?.type==='video'&&attach.videoId){
      const idx=channelPostVideos.push(mapInvidiousVideo(attach,instance))-1;
      attachments.push(`<button class="inline-btn channel-post-video" data-post-video="${idx}">Watch attached video</button>`);
    }else if(attach?.type==='image'){
      const img=pickInvidiousThumb(attach.imageThumbnails||attach.thumbnails,instance)||attach.url||'';
      if(img)attachments.push(`<img src="${escapeHtml(img)}" alt="">`);
    }else if(attach?.type==='multiImage'&&Array.isArray(attach.images)){
      attach.images.slice(0,4).forEach(imgObj=>{
        const img=pickInvidiousThumb(Array.isArray(imgObj)?imgObj:(imgObj.imageThumbnails||imgObj.thumbnails),instance)||imgObj.url||'';
        if(img)attachments.push(`<img src="${escapeHtml(img)}" alt="">`);
      });
    }else if(attach?.type==='poll'&&Array.isArray(attach.choices)){
      attachments.push(`<div class="channel-post-meta">${escapeHtml(attach.choices.map(c=>c.text||c).join(' · '))}</div>`);
    }
    const meta=[post.publishedText,post.likeCount?`${compactNumber(post.likeCount)} likes`:null].filter(Boolean).join(' · ');
    return`<div class="channel-post">
      <div class="channel-post-text">${escapeHtml(post.content||post.contentHtml?.replace(/<[^>]+>/g,'')||'')}</div>
      ${attachments.length?`<div class="channel-post-media">${attachments.join('')}</div>`:''}
      <div class="channel-post-meta">${escapeHtml(meta)}</div>
    </div>`;
  }).join('');
  channelPosts.querySelectorAll('.channel-post-video').forEach(btn=>btn.onclick=()=>{
    closeChannelModal();
    openVideoModal(channelPostVideos[+btn.dataset.postVideo]);
  });
}

function makeChannelState(ch,instance){

      posts:{kind:'posts',label:'Posts',basePath:`/api/v1/channels/${id}/community`,items:[],keys:new Set(),continuation:null,pagesLoaded:0,done:false,loading:false,started:false,el:channelPosts,statusEl:channelPostsStatus,emptyText:'No community posts found'}

function setChannelStatus(sec,msg){
  if(sec?.statusEl)sec.statusEl.textContent=msg||'';
}

function renderChannelSection(kind){
  if(!channelState)return;
  const sec=channelState.tabs[kind];
  if(!sec)return;
  if(!sec.items.length&&sec.loading){
    // Only show spinner if grid is completely empty (no cards yet)
    if(!sec.el.querySelector('.channel-mini-card,.channel-post'))
      sec.el.innerHTML=`<div class="loading">Loading ${escapeHtml(sec.label.toLowerCase())}...</div>`;
  }else if(sec.kind==='posts'){
    renderChannelPosts(sec.items,channelState.instance);
  }else{
    renderChannelVideoCards(sec.el,sec.items,sec.emptyText);
  }
}

function showChannelTab(kind){
  if(!channelState?.tabs[kind])return;
  channelState.active=kind;
  setChannelTab(kind);
  renderChannelSection(kind);
  if(!channelState.tabs[kind].started)loadChannelTabPages(kind,channelModalToken);
}

function channelPagePath(sec){
  if(!sec.continuation)return sec.basePath;
  return `${sec.basePath}${sec.basePath.includes('?')?'&':'?'}continuation=${encodeURIComponent(sec.continuation)}`;
}

function addChannelItems(sec,data,instance){
  const rows=sec.kind==='posts'?(data.comments||[]):(data.videos||[]);
  for(const item of rows){
    const key=sec.kind==='posts'
      ?(item.commentId||`${item.published||''}:${item.content||''}`)
      :`${item.videoId||''}:${item.title||''}`;
    if(sec.keys.has(key))continue;
    sec.keys.add(key);
    sec.items.push(sec.kind==='posts'?item:mapInvidiousVideo(item,instance));
  }
  sec.continuation=data.continuation||'';
  sec.done=!sec.continuation||!rows.length;
}

async function loadChannelTabPages(kind,token){
  if(!channelState?.tabs[kind])return;
  const sec=channelState.tabs[kind];
  if(sec.loading||sec.done)return;
  sec.loading=true;
  sec.started=true;
  renderChannelSection(kind);
  while(token===channelModalToken&&!sec.done&&sec.pagesLoaded<CHANNEL_PAGE_TIMEOUTS.length){
    const page=sec.pagesLoaded+1;
    setChannelStatus(sec,`Loading ${sec.label} page ${page}...`);
    try{
      const res=await fetchInvidiousJson(channelPagePath(sec),channelState.instance,CHANNEL_PAGE_TIMEOUTS[sec.pagesLoaded]);
      if(token!==channelModalToken)return;
      channelState.instance=res.instance||channelState.instance;
      sec.pagesLoaded++;
      addChannelItems(sec,res.data||{},channelState.instance);
      renderChannelSection(kind);
    }catch(e){
      console.warn(`${sec.label} page ${page} failed`,e);
      sec.done=true;
      break;
    }
  }
  sec.loading=false;
  if(token!==channelModalToken)return;
  renderChannelSection(kind);
  if(sec.items.length){
    setChannelStatus(sec,sec.done?`Loaded ${sec.pagesLoaded} page${sec.pagesLoaded!==1?'s':''}.`:`Loaded ${sec.pagesLoaded} pages.`);
  }else{
    setChannelStatus(sec,sec.done?`No ${sec.label.toLowerCase()} found.`:`Could not load ${sec.label.toLowerCase()}.`);
  }
}

// Tracks what's currently rendered in the main video grid to avoid scroll-resetting full redraws
let _gridRenderedIds=[];

function renderVideoGrid(list,statusText='',emptyText='No videos found',channels=[]){
  const badgeClass={
    'Archive Video':'badge-archive-v','PeerTube':'badge-peertube','TED':'badge-ted',
    'Vimeo':'badge-vimeo','Dailymotion':'badge-dailymotion','Wikimedia':'badge-wikimedia',
    'NASA':'badge-nasa','Mixcloud':'badge-mixcloud','YouTube':'badge-youtube'
  };

  // Build/update channel strip without touching video cards
  let channelStrip=grid.querySelector('.channel-strip');
  if(channels?.length){
    const channelHtml=renderChannelStrip(channels);
    if(!channelStrip){
      grid.insertAdjacentHTML('afterbegin',channelHtml);
    }
    bindChannelCards(channels);
    channelStrip=grid.querySelector('.channel-strip');
  } else if(channelStrip){
    channelStrip.remove();
    channelStrip=null;
  }

  // Status/loading element — always at the end, update in place
  let statusEl=grid.querySelector('.grid-status');
  if(!statusEl){
    statusEl=document.createElement('div');
    statusEl.className='grid-status';
    grid.appendChild(statusEl);
  }

  if(!list.length){
    // Clear any existing video cards and reset tracker
    grid.querySelectorAll('.video-card').forEach(c=>c.remove());
    _gridRenderedIds=[];
    statusEl.className='grid-status '+(statusText?'loading':'empty');
    statusEl.innerHTML=statusText?escapeHtml(statusText):escapeHtml(emptyText);
    // Move status after channel strip if present
    if(channelStrip)channelStrip.after(statusEl);
    return;
  }

  // Figure out which items are new (append-only, preserving scroll)
  const newItems=list.slice(_gridRenderedIds.length);
  if(newItems.length){
    const fragment=document.createDocumentFragment();
    newItems.forEach((v,offset)=>{
      const i=_gridRenderedIds.length+offset;
      const bc=badgeClass[v.provider]||'';
      const thumb=v.thumb
        ?`<img src="${escapeHtml(v.thumb)}" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display='none'">`
        :`<svg viewBox="0 0 24 24" style="width:26px;height:26px;fill:var(--primary)"><path d="M10 8l6 4-6 4V8z"/><path d="M21 3H3a2 2 0 00-2 2v14a2 2 0 002 2h18a2 2 0 002-2V5a2 2 0 00-2-2zm0 16H3V5h18v14z"/></svg>`;
      const div=document.createElement('div');
      div.className='card video-card';
      div.dataset.vidx=i;
      div.style.cursor='pointer';
      div.innerHTML=`<div class="card-icon" style="width:100%;height:90px;border-radius:6px;margin-bottom:10px">${thumb}</div>
        <div class="card-title">${escapeHtml(v.name)}</div>
        <div class="card-sub">${escapeHtml(v.artist||'')}</div>
        <span class="card-badge ${bc}">${escapeHtml(v.provider)}</span>`;
      div.onclick=()=>openVideoModal(list[+div.dataset.vidx]);
      fragment.appendChild(div);
      _gridRenderedIds.push(v.id||v.name||i);
    });
    // Insert before status element
    statusEl.before(fragment);
  }

  // Update status
  if(statusText){
    statusEl.className='grid-status loading';
    statusEl.textContent=statusText;
    statusEl.style.display='';
  } else {
    statusEl.style.display='none';
  }
}

async function loadOrSearch(){
  const token=++searchToken;
  const q=search.value.trim();
  if(currentApi==='online'&&!q){
    tracks=[];_gridRenderedIds=[];
    grid.innerHTML='<div class="empty">Type something to search...</div>';
    return;
  }
  if(currentApi==='radio'&&!q){
    tracks=[];_gridRenderedIds=[];
    grid.innerHTML='<div class="empty">Search for a station, genre, or country...</div>';
    return;
  }
  if(currentApi==='video'&&!q){
    tracks=[];_gridRenderedIds=[];
    grid.innerHTML='<div class="empty">Search for a video, topic, or talk...</div>';
    return;
  }
  if(currentApi==='podcast'&&!q){
    tracks=[];_gridRenderedIds=[];
    grid.innerHTML='<div class="empty">Search for a podcast, DJ mix, or show...</div>';
    return;
  }
  grid.innerHTML='<div class="loading">Loading...</div>';
  _gridRenderedIds=[];
  try{
    let result;
    if(currentApi==='local'){
      result=await fetchNative();
      if(token!==searchToken)return;
      tracks=result;
      if(!tracks.length){
        grid.innerHTML='<div class="empty">No tracks yet — click <strong>Upload</strong> to add your music</div>';
        return;
      }
    } else if(currentApi==='radio'){
      result=await fetchRadio(q);
      if(token!==searchToken)return;
      tracks=result;
    } else if(currentApi==='video'){
      let channelResults=[],partialVideos=[];
      const channelLoad=withTimeout(fetchInvidiousChannels(q),5000).then(channels=>{
        if(token!==searchToken)return;
        channelResults=channels;
        renderVideoGrid(partialVideos,'Searching YouTube...','No videos found',channelResults);
      }).catch(()=>[]);
      result=await fetchVideoAll(q,(partial,status)=>{
        partialVideos=partial;
        if(token===searchToken)renderVideoGrid(partial,status,'No videos found',channelResults);
      },()=>token===searchToken);
      await channelLoad;
      if(token!==searchToken)return;
      renderVideoGrid(result,'','No videos found',channelResults);
      return;
    } else if(currentApi==='podcast'){
      result=await fetchPodcastAll(q,(partial,status)=>{
        if(token===searchToken)renderVideoGrid(partial,status,'No podcasts found');
      },()=>token===searchToken);
      if(token!==searchToken)return;
      renderVideoGrid(result,'','No podcasts found');
      return;
    } else {
      result=await fetchOnline(q);
      if(token!==searchToken)return;
      tracks=result;
    }
    renderGrid();
  }catch(e){
    if(token!==searchToken)return;
    console.error(e);
    grid.innerHTML=`<div class="empty">Error: ${e.message}</div>`;
  }
}

// ── Newgrounds CDN URL builder (shared by modal + play()) ─────────────────
function buildNGUrls(id,nameRaw){
  const folder=Math.floor(parseInt(id)/1000)*1000;
  const base=`https://audio.ngfiles.com/${folder}/${id}`;
  const ngSanitize=(s,max)=>s.replace(/&/g,'amp').replace(/</g,'lt').replace(/>/g,'gt').replace(/"/g,'quot').replace(/\s+/g,'-').replace(/[^\w-]/g,'').slice(0,max);
  const ngUnderscore=(s,max)=>s.replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_]/g,'').slice(0,max);
  const slug6=nameRaw.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,6);
  const variants=[
    ...[26,28,30,32].map(n=>`${base}_${ngSanitize(nameRaw,n)}.mp3`),
    `${base}_${ngSanitize(nameRaw,999)}.mp3`,
    `${base}_newgrounds_${slug6}.mp3`,
    ...[26,28,30,32].map(n=>`${base}_${ngUnderscore(nameRaw,n)}.mp3`),
    `${base}_${ngUnderscore(nameRaw,999)}.mp3`,
    ...[26,28,30,32].map(n=>`${base}_${ngSanitize(nameRaw,n).toLowerCase()}.mp3`),
    ...[26,28,30,32].map(n=>`${base}_${ngUnderscore(nameRaw,n).toLowerCase()}.mp3`),
    `${base}_${ngSanitize(nameRaw,999).toLowerCase()}.mp3`,
    `${base}_${ngUnderscore(nameRaw,999).toLowerCase()}.mp3`,
  ];
  return [...new Set(variants)];
}

async function play(i){
  const t=getTracks()[i];if(!t)return;
  // Stop and clear any active NG proxy
  if(audio._ngProxy){
    const p=audio._ngProxy;
    p.pause();p.src='';p.onerror=null;p.ontimeupdate=null;p.onended=null;
    audio._ngProxy=null;
  }
  audio.pause();
  if(audio._blobURL){URL.revokeObjectURL(audio._blobURL);audio._blobURL=null}
  // Temporarily disable onerror to prevent empty-src from triggering chain
  audio.onerror=null;
  audio.src='';
  curIdx=i;curTrack=t;
  player.style.display='flex';
  pTitle.textContent=t.name;
  pCtx.textContent=t.isLocal?'Local Library':t.provider||'Online';
  cTime.textContent='0:00';dTime.textContent='0:00';progFill.style.width='0';

  if(t.isLocalVideo&&t.blob){
    // Local video — show in video modal, not audio player
    const blobUrl=URL.createObjectURL(t.blob);
    videoEl._blobURL=blobUrl;
    player.style.display='none';
    openVideoModal({name:t.name,artist:'Local Library',blobUrl});
    return;
  } else if(t.isNGRef){
    const urls=buildNGUrls(t.ngId,t.ngName);
    let idx=0;
    let ngLocal=document.getElementById('ngLocalAudio');
    if(!ngLocal){
      ngLocal=document.createElement('audio');
      ngLocal.id='ngLocalAudio';
      ngLocal.style.display='none';
      document.body.appendChild(ngLocal);
    }
    ngLocal.pause();
    ngLocal.src='';
    ngLocal.onerror=null;ngLocal.oncanplay=null;ngLocal.ontimeupdate=null;ngLocal.onended=null;ngLocal.onplay=null;ngLocal.onpause=null;
    const tryNext=()=>{
      if(idx>=urls.length)return;
      ngLocal.src=urls[idx++];
      ngLocal.load();
    };
    ngLocal.onerror=tryNext;
    ngLocal.oncanplay=()=>{ngLocal.play().catch(()=>{});ngLocal.oncanplay=null;};
    ngLocal.ontimeupdate=()=>{
      if(ngLocal.duration){
        progFill.style.width=(ngLocal.currentTime/ngLocal.duration*100)+'%';
        cTime.textContent=fmt(ngLocal.currentTime);
        dTime.textContent=fmt(ngLocal.duration);
      }
    };
    ngLocal.onended=()=>{if(repeating){ngLocal.currentTime=0;ngLocal.play().catch(()=>{})}else nextBtn.click()};
    ngLocal.onplay=()=>updateUI();
    ngLocal.onpause=()=>updateUI();
    audio._ngProxy=ngLocal;
    player.style.display='flex';
    tryNext();
    updateUI();
    return;
  } else if(t.isLocal&&t.blob){
    const url=URL.createObjectURL(t.blob);
    audio._blobURL=url;
    audio.src=url;
  } else if(t.isNative){
    t.cdn=0;
    audio.src=CDN1(t.file);
  } else if(t.isArchive){
    try{
      const resolved=await resolveArchiveUrl(t);
      // bail if user already moved on to another track
      if(curTrack!==t)return;
      audio.src=resolved;
    }catch(e){
      toast('Could not load Archive track');nextBtn.click();return;
    }
  } else {
    audio.src=t.url;
  }

  audio.onerror=ngOnerror;
  audio.load();
  audio.play().catch(()=>{
    if(t.isNative&&!t.isLocal){t.cdn=1;audio.src=CDN2(t.file);audio.play().catch(()=>nextBtn.click())}
  });
  updateUI();
}

function updateUI(){
  const a=audio._ngProxy||audio;
  const playing=!a.paused&&!a.ended&&a.readyState>2;
  playIc.style.display=playing?'none':'block';
  pauseIc.style.display=playing?'block':'none';
  repBtn.classList.toggle('active',repeating);
  $$('.card').forEach(c=>c.classList.toggle('playing-card',+c.dataset.idx===curIdx));
  $$('.sb-item').forEach(c=>c.classList.toggle('active',+c.dataset.idx===curIdx));
}

function renderGrid(){
  const q=search.value.toLowerCase();
  const list=q?tracks.filter(t=>t.name.toLowerCase().includes(q)):tracks;
  if(!list.length){grid.innerHTML='<div class="empty">No tracks found</div>';return}
  grid.innerHTML=list.map((t,i)=>{
    const real=tracks.indexOf(t);
    const icon=t.isNative?`<div class="card-icon">${t.isLocalVideo?`<svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h12a1 1 0 001-1v-3.5l4 4v-11l-4 4z"/></svg>`:`<svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>`}</div>`:
      `<div class="card-icon"><img src="${t.art||''}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><svg viewBox="0 0 24 24" style="display:none"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg></div>`;
    const providerBadge=(()=>{
      if(t.isLocal||t.isNative)return'';
      const bc={'Mixcloud':'badge-mixcloud','Wikimedia':'badge-wikimedia-a','Jamendo':'','ccMixter':'','Archive':'','Audius':'','iTunes':'','Deezer':''};
      const cls=bc[t.provider];
      if(cls===undefined)return`<span class="card-badge" style="background:#1a2a3a;color:#93c5fd">${t.provider}</span>`;
      if(!cls)return'';
      return`<span class="card-badge ${cls}">${t.provider}</span>`;
    })();
    const saveBtn=(!t.isNative&&!t.isLocal&&t.url&&!t.isArchive)?
      `<button class="card-save" data-sidx="${real}">⬇ Save to Local</button>`:'';
    return`<div class="card" data-idx="${real}">
      ${t.isNative?`<button class="card-add"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>`:''}
      ${icon}
      <div class="card-title">${t.name}</div>
      <div class="card-sub">${t.isLocalVideo?'Local Video':t.isNGRef?'Newgrounds':t.isLocal?'Local':t.provider?(t.artist?`${t.provider} · ${t.artist}`:t.provider):'Online'}</div>
      ${providerBadge}
      ${saveBtn}
    </div>`;
  }).join('');
  $$('.card').forEach(c=>{
    c.onclick=e=>{if(!e.target.closest('.card-add')&&!e.target.closest('.card-save'))play(+c.dataset.idx)};
    const add=c.querySelector('.card-add');
    if(add) add.onclick=e=>{e.stopPropagation();showGridDD(+c.dataset.idx,add)};
    const save=c.querySelector('.card-save');
    if(save) save.onclick=e=>{e.stopPropagation();saveToLocal(tracks[+save.dataset.sidx],save)};
  });
  updateUI();
}

function renderPlModal(){
  if(!playlists.length){plList.innerHTML='<div class="empty" style="padding:16px">No playlists</div>';return}
  plList.innerHTML=playlists.map(p=>`
    <div class="pl-row" data-id="${p.id}">
      <span>${p.name} (${p.tracks.length})</span>
      <button class="del">✕</button>
    </div>`).join('');
  plList.querySelectorAll('.pl-row span').forEach(el=>el.onclick=()=>{
    curPlId=+el.closest('.pl-row').dataset.id;plModal.classList.remove('open');openSb(curPlId);
  });
  plList.querySelectorAll('.del').forEach(b=>b.onclick=()=>{
    const id=+b.closest('.pl-row').dataset.id;
    playlists=playlists.filter(x=>x.id!==id);renderPlModal();
    if(curPlId===id)closeSb();
  });
}

function openSb(id){
  const p=playlists.find(x=>x.id===id);if(!p)return;
  curPlId=id;
  sidebar.classList.add('open');main.classList.add('shifted');player.classList.add('shifted');
  $('#sbTitle').textContent=p.name;
  renderSb();
}

function closeSb(){
  sidebar.classList.remove('open');main.classList.remove('shifted');player.classList.remove('shifted');
  curPlId=null;
  playTracks=null;
  if(currentApi==='local')renderGrid();
}

function renderSb(){
  const p=playlists.find(x=>x.id===curPlId);if(!p)return;
  if(!p.tracks.length){sbList.innerHTML='<div class="empty" style="padding:30px">Empty</div>';updateUI();return}
  sbList.innerHTML=p.tracks.map((t,i)=>`
    <div class="sb-item" data-idx="${i}">
      <span class="sb-num">${i+1}</span>
      <div class="sb-info"><div class="sb-name">${t.name}</div><div class="sb-ext">${t.file.split('.').pop().toUpperCase()}</div></div>
      <button class="sb-del">✕</button>
    </div>`).join('');
  $$('.sb-item').forEach(el=>{
    el.onclick=e=>{if(!e.target.closest('.sb-del')){
      playTracks=p.tracks;curPlId=p.id;play(+el.dataset.idx);
    }};
    el.querySelector('.sb-del').onclick=()=>{p.tracks.splice(+el.dataset.idx,1);renderSb()};
  });
  updateUI();
}

function showGridDD(idx,btn){
  const t=tracks[idx];
  const plItems=playlists.map(p=>{
    const inPl=p.tracks.some(x=>x.file===t.file);
    return`<div class="dd-item ${inPl?'disabled':''}" data-id="${p.id}">${inPl?'✓':'+ '}${p.name}</div>`;
  }).join('');
  const delItem=t?.isLocal?`<div class="dd-item dd-del" style="color:#f55;margin-top:4px;border-top:1px solid var(--border)">🗑 Remove from library</div>`:'';
  gridDropdown.innerHTML=plItems+(playlists.length?'':`<div class="dd-item disabled">No playlists</div>`)+delItem;
  const r=btn.getBoundingClientRect();
  gridDropdown.style.top=`${r.bottom+6}px`;gridDropdown.style.left=`${Math.min(r.left,innerWidth-180)}px`;
  gridDropdown.classList.add('show');
  gridDropdown.querySelectorAll('.dd-item:not(.disabled):not(.dd-del)').forEach(d=>d.onclick=()=>{
    const p=playlists.find(x=>x.id===+d.dataset.id);
    if(p&&tracks[idx]){p.tracks.push({...tracks[idx]})}
    gridDropdown.classList.remove('show');
  });
  const delBtn=gridDropdown.querySelector('.dd-del');
  if(delBtn)delBtn.onclick=async()=>{
    gridDropdown.classList.remove('show');
    await dbDelete(t.file);
    if(curTrack?.file===t.file){audio.pause();audio.src='';player.style.display='none';}
    tracks=await fetchNative();renderGrid();
    toast(`Removed "${t.name}"`);
  };
}

$('#sbAddBtn').onclick=e=>{
  e.stopPropagation();
  if(sbDropdown.classList.contains('show')){sbDropdown.classList.remove('show');return}
  const p=playlists.find(x=>x.id===curPlId);if(!p)return;
  const q=search.value.toLowerCase();
  const avail=q?tracks.filter(t=>t.name.toLowerCase().includes(q)):tracks;
  const list=avail.filter(t=>!p.tracks.some(x=>x.file===t.file));
  sbDropdown.innerHTML=list.length?list.map(t=>`<div class="sb-dd-item" data-file="${t.file}">${t.name}</div>`).join(''):'<div class="sb-dd-item disabled">All added</div>';
  sbDropdown.querySelectorAll('.sb-dd-item:not(.disabled)').forEach(d=>d.onclick=()=>{
    const t=tracks.find(x=>x.file===d.dataset.file);
    if(t){p.tracks.push({...t});renderSb();sbDropdown.classList.remove('show')}
  });
  sbDropdown.classList.add('show');
};

document.onclick=e=>{
  if(!e.target.closest('.card-add')&&!e.target.closest('.dropdown'))gridDropdown.classList.remove('show');
  if(!e.target.closest('.sb-add-btn')&&!e.target.closest('.sb-dropdown'))sbDropdown.classList.remove('show');
};

$('#apiSelect').onchange=e=>{currentApi=e.target.value;playTracks=null;const isLocal=currentApi==='local';plBtn.classList.toggle('visible',isLocal);uploadBtn.classList.toggle('visible',isLocal);if(!isLocal)closeSb();closeVideoModal();closeChannelModal();$('#ngBtn').style.display=currentApi==='online'?'block':'none';loadOrSearch()};
$('#plBtn').onclick=()=>{plModal.classList.add('open');renderPlModal();$('#newPlInput').value=''};
$('#closePl').onclick=()=>plModal.classList.remove('open');
$('#createPl').onclick=()=>{const n=$('#newPlInput').value.trim();if(n){playlists.push({id:Date.now(),name:n,tracks:[]});renderPlModal();$('#newPlInput').value=''}};
$('#newPlInput').onkeydown=e=>{if(e.key==='Enter')$('#createPl').click()};
$('#sbClose').onclick=closeSb;
document.querySelector('.logo').onclick=()=>{closeSb();closeVideoModal();closeChannelModal()};

let searchT;
search.oninput=()=>{clearTimeout(searchT);searchT=setTimeout(()=>currentApi==='local'?renderGrid():loadOrSearch(),300)};
$('#apiSelect').addEventListener('change',()=>{
  const placeholders={online:'Search tracks...',radio:'Search stations...',video:'Search videos...',podcast:'Search podcasts...',local:'Filter local tracks...'};
  search.placeholder=placeholders[currentApi]||'Search...';
});

ppBtn.onclick=()=>{
  const a=audio._ngProxy||audio;
  if(!a.src)return;
  if(a.paused){a.play().catch(()=>{}).then(()=>updateUI())}
  else{a.pause();updateUI()}
};
prevBtn.onclick=()=>{const t=getTracks();if(t.length)play((curIdx-1+t.length)%t.length)};
nextBtn.onclick=()=>{const t=getTracks();if(t.length)play((curIdx+1)%t.length)};
repBtn.onclick=()=>{repeating=!repeating;updateUI()};
// ── Volume with Web Audio boost ────────────────────────────────────────────
let audioCtx=null,gainNode=null;

function ensureAudioCtx(){
  if(audioCtx)return;
  try{
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    gainNode=audioCtx.createGain();
    gainNode.gain.value=1;
    gainNode.connect(audioCtx.destination);
    const src=audioCtx.createMediaElementSource(audio);
    src.connect(gainNode);
  }catch(e){audioCtx=null;gainNode=null;}
}

// Init Web Audio on first user gesture so it's ready before playback
document.addEventListener('click',function initCtx(){
  ensureAudioCtx();
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  document.removeEventListener('click',initCtx);
},{once:true});

const VOL_ICONS={
  mute:'M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z',
  low:'M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z',
  mid:'M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z',
  high:'M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z'
};
let isMuted=false,premuteVol=100;

function setVolume(pct){
  pct=Math.max(0,Math.min(200,pct));
  if(pct<=100){
    // Normal range — pure native volume, no Web Audio needed
    audio.volume=pct/100;
    if(audio._ngProxy)audio._ngProxy.volume=pct/100;
    if(gainNode)gainNode.gain.value=1;
  } else {
    // Boost range — native at 1.0, gain node multiplies
    audio.volume=1;
    if(audio._ngProxy)audio._ngProxy.volume=1;
    ensureAudioCtx();
    if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
    if(gainNode)gainNode.gain.value=pct/100;
  }
  // Icon state
  const path=document.getElementById('volIconPath');
  if(path){
    if(pct===0)path.setAttribute('d',VOL_ICONS.mute);
    else if(pct<=50)path.setAttribute('d',VOL_ICONS.low);
    else if(pct<=100)path.setAttribute('d',VOL_ICONS.mid);
    else path.setAttribute('d',VOL_ICONS.high);
  }
  // Label
  const lbl=$('#volPct');
  if(lbl){lbl.textContent=pct+'%';lbl.style.color=pct>100?'var(--primary)':'var(--sub)';}
}

$('#volRange').oninput=e=>{
  let v=parseInt(e.target.value);
  if(Math.abs(v-100)<=3){v=100;e.target.value=100;}
  isMuted=false;
  premuteVol=v;
  setVolume(v);
};

$('#volIconBtn').onclick=()=>{
  if(isMuted){
    isMuted=false;
    $('#volRange').value=premuteVol;
    setVolume(premuteVol);
  } else {
    premuteVol=parseInt($('#volRange').value);
    isMuted=true;
    audio.volume=0;
    if(audio._ngProxy)audio._ngProxy.volume=0;
    if(gainNode)gainNode.gain.value=0;
    const path=document.getElementById('volIconPath');
    if(path)path.setAttribute('d',VOL_ICONS.mute);
    const lbl=$('#volPct');
    if(lbl){lbl.textContent='0%';lbl.style.color='var(--sub)';}
  }
};
setVolume(100);
pBar.onclick=e=>{
  const a=audio._ngProxy||audio;
  const r=pBar.getBoundingClientRect();
  if(a.duration)a.currentTime=((e.clientX-r.left)/r.width)*a.duration;
};

audio.onloadedmetadata=()=>{if(audio.duration&&isFinite(audio.duration))dTime.textContent=fmt(audio.duration)};
audio.ondurationchange=()=>{if(audio.duration&&isFinite(audio.duration))dTime.textContent=fmt(audio.duration)};
audio.onplay=()=>updateUI();
audio.onplaying=()=>updateUI();
audio.onpause=()=>updateUI();
audio.onwaiting=()=>{playIc.style.display='none';pauseIc.style.display='none'};
audio.ontimeupdate=()=>{if(!audio.duration||!isFinite(audio.duration))return;cTime.textContent=fmt(audio.currentTime);progFill.style.width=(audio.currentTime/audio.duration*100)+'%';if(audio.duration&&isFinite(audio.duration))dTime.textContent=fmt(audio.duration)};
audio.onended=()=>{if(repeating){audio.currentTime=0;audio.play().catch(()=>{})}else nextBtn.click()};
audio.oncanplay=()=>{if(curTrack?.isNGRef)audio.play().catch(()=>{})};
function ngOnerror(){
  if(curTrack?.isNGRef){
    if(!curTrack._ngUrls){
      curTrack._ngUrls=buildNGUrls(curTrack.ngId,curTrack.ngName);
      curTrack._ngIdx=0;
    }
    if(curTrack._ngIdx<curTrack._ngUrls.length){
      audio.src=curTrack._ngUrls[curTrack._ngIdx++];
      audio.load();
    }
  } else if(curTrack?.isNative&&!curTrack?.isLocal){
    curTrack.cdn=1;audio.src=CDN2(curTrack.file);audio.play().catch(()=>nextBtn.click());
  } else if(curTrack?.isArchive&&!curTrack?._archiveFallback){
    curTrack._archiveFallback=true;audio.src=`https://archive.org/download/${curTrack.id}`;audio.load();audio.play().catch(()=>nextBtn.click());
  }
}
audio.onerror=ngOnerror;

function fmt(s){const m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+(sec<10?'0':'')+sec}

loadOrSearch();

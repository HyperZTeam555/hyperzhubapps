<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iframe fullscreen videos blocked gyatt</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }
    iframe {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <iframe 
    src="https://figurecc.cine-softwares.workers.dev/" 
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
    referrerpolicy="no-referrer"
  ></iframe>

  <script>
    async function enforceParentFullscreen() {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        }
      } catch (e) {
      }
    }
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        setTimeout(enforceParentFullscreen, 50);
      }
    });

    window.addEventListener('load', enforceParentFullscreen);
    const originalRequestFullscreen = Element.prototype.requestFullscreen;
    Element.prototype.requestFullscreen = function() {
      // only allow root element (our page) to go fullscreen
      if (this === document.documentElement || this === document.body) {
        return originalRequestFullscreen.apply(this, arguments);
      }
      console.log('blocked fullscreen request from:', this.tagName);
      return Promise.reject(new Error('fullscreen disabled for content'));
    };
  </script>

</body>
</html>

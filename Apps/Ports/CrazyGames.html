<!doctype html>
<html>
<head>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100vh;
      border: none;
    }

    /* Start menu overlay */
    #startMenu {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    #menuBox {
      background: #1c1c1c;
      color: white;
      padding: 25px;
      border-radius: 12px;
      width: 320px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,255,204,0.2);
    }

    #menuBox h2 {
      margin: 0 0 10px 0;
      font-size: 18px;
      color: #00ffcc;
    }

    #menuBox p {
      font-size: 13px;
      color: #ccc;
      line-height: 1.4;
    }

    #okBtn {
      margin-top: 15px;
      padding: 8px 18px;
      border: none;
      border-radius: 6px;
      background: #00ffcc;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }

    #okBtn:hover {
      background: #00ddb3;
    }
  </style>
</head>
<body>

  <div id="startMenu">
    <div id="menuBox">
      <h2>Notice</h2>
      <p>
        Only searching CrazyGames games works. (Don't press the enter key in the search bar.)<br>
        Built-in site buttons may not function properly.
      </p>
      <button id="okBtn">OK</button>
    </div>
  </div>

  <iframe id="frame"></iframe>

  <script>
    const target = "https://www.crazygames.com";
    const proxied = "https://api.allorigins.win/raw?url=" + encodeURIComponent(target);

    document.getElementById("frame").src = proxied;

    const menu = document.getElementById("startMenu");
    const okBtn = document.getElementById("okBtn");

    function closeMenu() {
      menu.style.display = "none";
    }

    okBtn.onclick = closeMenu;

    setTimeout(closeMenu, 5000);
  </script>

</body>
</html>

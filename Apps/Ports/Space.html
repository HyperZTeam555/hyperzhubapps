<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space</title>

<style>
body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    background: radial-gradient(circle at top, #1a0033, #05000a);
    color: #c084fc;
    font-family: 'Courier New', monospace;
    overflow: hidden;
}

#home {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
}

h1 {
    font-size: 2.8rem;
    letter-spacing: 5px;
    text-shadow: 0 0 25px #9333ea;
    margin-bottom: 20px;
}

/* MAIN LINK */
.main-link {
    margin-bottom: 25px;
    padding: 18px 140px; /* LONG BUTTON */
    font-size: 1.2rem;
    border-radius: 12px;
    border: 2px solid #9333ea;
    background: rgba(147, 51, 234, 0.2);
    color: #c084fc;
    cursor: pointer;
    transition: 0.3s;
    letter-spacing: 2px;
}

.main-link:hover {
    background: #9333ea;
    color: black;
    box-shadow: 0 0 25px #9333ea;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
    width: 85%;
    max-width: 900px;
}

.grid button {
    padding: 14px;
    background: rgba(147, 51, 234, 0.08);
    border: 1px solid #9333ea;
    color: #c084fc;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.25s;
}

.grid button:hover {
    background: #9333ea;
    color: black;
    box-shadow: 0 0 20px #9333ea;
}

#viewer {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
}

.close-btn {
    position: absolute;
    top: 10px;
    left: 12px;
    font-size: 18px;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(6px);
    border: 1px solid #9333ea;
    color: #c084fc;
    padding: 2px 8px;
    border-radius: 8px;
    cursor: pointer;
    z-index: 10;
}

.close-btn:hover {
    background: #9333ea;
    color: black;
}
</style>
</head>

<body>

<div id="home">
    <h1>Space</h1>

    <!-- MAIN LINK -->
    <button class="main-link" onclick="openSite('https://gointospace.app')">
        🚀 MAIN LINK
    </button>

    <div class="grid">
        <button onclick="openSite('https://spacing.centromariapolis.cl/')">Link 1</button>
        <button onclick="openSite('https://spacing.gorich.hk/')">Link 2</button>
        <button onclick="openSite('https://spacing.night.int.yt/')">Link 3</button>
        <button onclick="openSite('https://spacing.is-a.software.cdn.cloudflare.net/')">Link 4</button>

        <button onclick="openSite('https://buy.gpu74.ru/')">Link 5</button>
        <button onclick="openSite('https://member.electricpiano.xyz.cdn.cloudflare.net/')">Link 6</button>
        <button onclick="openSite('https://outerspace.boiso.ar/')">Link 7</button>
        <button onclick="openSite('https://graph.desmos.live.cdn.cloudflare.net/')">Link 8</button>
        <button onclick="openSite('https://outerspace.arrowbases.com/')">Link 9</button>
        <button onclick="openSite('https://outerspace.regu.ch/')">Link 10</button>
        <button onclick="openSite('https://app.infotechnology.com/')">Link 11</button>
        <button onclick="openSite('https://outerspace.tomashirsch.cl/')">Link 12</button>
    </div>
</div>

<div id="viewer">
    <div class="close-btn" onclick="closeViewer()">✕</div>
    <iframe id="frame"></iframe>
</div>

<script>
function openSite(url) {
    document.getElementById("home").style.display = "none";
    document.getElementById("viewer").style.display = "block";
    document.getElementById("frame").src = url;
}

function closeViewer() {
    document.getElementById("viewer").style.display = "none";
    document.getElementById("home").style.display = "flex";
    document.getElementById("frame").src = "";
}
</script>

</body>
</html>

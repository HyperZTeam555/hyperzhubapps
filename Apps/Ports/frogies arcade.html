<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Green Space Menu</title>

<style>
body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    background: radial-gradient(circle at top, #001a0a, #000500);
    color: #7CFFB2;
    font-family: 'Courier New', monospace;
    overflow: hidden;
}

#home {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
}

h1 {
    font-size: 2.8rem;
    letter-spacing: 5px;
    text-shadow: 0 0 25px #00ff66;
    margin-bottom: 20px;
}

.main-link {
    margin-bottom: 25px;
    padding: 18px 140px;
    font-size: 1.2rem;
    border-radius: 12px;
    border: 2px solid #00ff66;
    background: rgba(0, 255, 102, 0.12);
    color: #7CFFB2;
    cursor: pointer;
    transition: 0.3s;
    letter-spacing: 2px;
}

.main-link:hover {
    background: #00ff66;
    color: black;
    box-shadow: 0 0 25px #00ff66;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
    width: 85%;
    max-width: 900px;
}

.grid button {
    padding: 14px;
    background: rgba(0, 255, 102, 0.08);
    border: 1px solid #00ff66;
    color: #7CFFB2;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.25s;
}

.grid button:hover {
    background: #00ff66;
    color: black;
    box-shadow: 0 0 20px #00ff66;
}

#viewer {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
    background: black;
}

.close-btn {
    position: absolute;
    top: 10px;
    left: 12px;
    font-size: 18px;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(6px);
    border: 1px solid #00ff66;
    color: #7CFFB2;
    padding: 2px 8px;
    border-radius: 8px;
    cursor: pointer;
    z-index: 10;
}

.close-btn:hover {
    background: #00ff66;
    color: black;
}
</style>
</head>

<body>

<div id="home">
    <h1>frogies arcade</h1>

    <button class="main-link" onclick="openSite('https://frogiesarcade.net/')">
        MAIN LINK
    </button>

    <div class="grid">
        <button onclick="openSite('https://full.boxathome.net/')">Link 1</button>
        <button onclick="openSite('https://frogiesarcade.win/')">Link 2</button>
        <button onclick="openSite('https://frog.alex.rf.gd/')">Link 3</button>
        <button onclick="openSite('https://thetheoryof.twilightparadox.com/')">Link 4</button>
        <button onclick="openSite('https://highschoolmathteachers.com/')">Link 5</button>
        <button onclick="openSite('https://vcsa-yt.keybusinessconnection.com/')">Link 6</button>
        <button onclick="openSite('https://phi.bz/')">Link 7</button>
		<button onclick="openSite('https://brooklyn.foundation/')">Link 9</button>
		<button onclick="openSite('https://frog.oofer.lat/')">Link 10</button>
    </div>
</div>

<div id="viewer">
    <div class="close-btn" onclick="closeViewer()">✕</div>

    <iframe
        id="frame"
        sandbox="allow-scripts allow-forms allow-same-origin allow-pointer-lock"
    ></iframe>
</div>

<script>
async function openSite(url) {
    document.getElementById("home").style.display = "none";
    document.getElementById("viewer").style.display = "block";

    const frame = document.getElementById("frame");

    try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP " + res.status);

        let html = await res.text();

        const base = new URL(url);

        // fix relative paths
        html = html.replace(
            /<head([^>]*)>/i,
            `<head$1><base href="${base.href}">`
        );

        // block new tab behavior
        html = html.replace(
            /target=["']_blank["']/gi,
            'target="_self"'
        );

        // disable popup scripts
        html = html.replace(
            /window\.open\s*\(/gi,
            'void('
        );

        frame.srcdoc = html;

    } catch (err) {
        frame.srcdoc = `
            <html>
            <body style="background:black;color:#00ff66;font-family:monospace;padding:20px">
                Failed to load:<br><br>
                ${err.message}
            </body>
            </html>
        `;
    }
}

function closeViewer() {
    document.getElementById("viewer").style.display = "none";
    document.getElementById("home").style.display = "flex";
    document.getElementById("frame").src = "";
}
</script>

</body>
</html>

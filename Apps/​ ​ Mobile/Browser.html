<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Browser</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #111827, #1f2937);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .card {
      width: 90%;
      max-width: 500px;
      padding: 32px;
      border-radius: 22px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.45);
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 22px;
      font-size: 2rem;
    }

    input {
      width: 100%;
      padding: 14px;
      border: none;
      outline: none;
      border-radius: 14px;
      font-size: 1rem;
      background: rgba(255,255,255,0.12);
      color: white;
    }

    input::placeholder {
      color: rgba(255,255,255,0.65);
    }

    .go-btn {
      display: block;
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 1rem;
      background: #3b82f6;
      color: white;
      transition: 0.2s;
      user-select: none;
    }

    .go-btn:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }

    .hint {
      margin-top: 16px;
      opacity: 0.7;
      font-size: 0.92rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Browser</h1>

    <input
      id="urlInput"
      type="text"
      placeholder="Enter URL..."
    />

    <a
      id="goButton"
      class="go-btn"
      href="#"
      target="_top"
    >
      GO
    </a>

    <div class="hint">
      Example: google.com
    </div>
  </div>

  <script>
    const input = document.getElementById("urlInput");
    const button = document.getElementById("goButton");

    function normalizeURL(url) {
      url = url.trim();

      if (
        !url.startsWith("http://") &&
        !url.startsWith("https://")
      ) {
        url = "https://" + url;
      }

      return url;
    }

    function updateButton() {
      const value = input.value.trim();

      if (!value) {
        button.href = "#";
        return;
      }

      button.href = normalizeURL(value);
    }

    input.addEventListener("input", updateButton);

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        updateButton();
        button.click();
      }
    });
  </script>

</body>
</html>

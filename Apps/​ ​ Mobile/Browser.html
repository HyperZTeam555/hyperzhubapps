<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quick Redirect</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #111827, #1f2937);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .card {
      width: 90%;
      max-width: 520px;
      padding: 32px;
      border-radius: 22px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.45);
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 22px;
      font-size: 2rem;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 14px;
      border: none;
      outline: none;
      border-radius: 14px;
      font-size: 1rem;
      background: rgba(255,255,255,0.12);
      color: white;
    }

    input::placeholder {
      color: rgba(255,255,255,0.65);
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 14px 22px;
      font-size: 1rem;
      background: #3b82f6;
      color: white;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }

    .hint {
      margin-top: 16px;
      opacity: 0.7;
      font-size: 0.92rem;
    }

    .fallback {
      margin-top: 12px;
      font-size: 0.85rem;
    }

    .fallback a {
      color: #93c5fd;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Quick Redirect</h1>

    <div class="row">
      <input
        id="urlInput"
        type="text"
        placeholder="Enter URL..."
      />
      <button onclick="goToSite()">GO</button>
    </div>

    <div class="hint">
      Example: google.com
    </div>

    <!-- tiny fallback link -->
    <div class="fallback">
      <a id="fallbackLink" href="#" target="_top">
        Open manually
      </a>
    </div>
  </div>

  <script>
    const input = document.getElementById("urlInput");
    const fallback = document.getElementById("fallbackLink");

    function normalizeURL(url) {
      url = url.trim();

      if (
        !url.startsWith("http://") &&
        !url.startsWith("https://")
      ) {
        url = "https://" + url;
      }

      return url;
    }

    function goToSite() {
      let url = input.value;

      if (!url.trim()) return;

      url = normalizeURL(url);

      fallback.href = url;

      // Break out of iframe
      try {
        window.top.location.href = url;
      } catch {
        window.open(url, "_top");
      }
    }

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        goToSite();
      }
    });

    input.addEventListener("input", () => {
      fallback.href = normalizeURL(input.value || "#");
    });
  </script>

</body>
</html>

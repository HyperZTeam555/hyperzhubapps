<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quick Redirect</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      font-family: Arial, sans-serif;
      color: white;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 20px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
    }

    button {
      padding: 14px 22px;
      border: none;
      border-radius: 12px;
      background: #3b82f6;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }

    .hint {
      margin-top: 15px;
      opacity: 0.7;
      font-size: 0.9rem;
    }

    a {
      color: #93c5fd;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Quick Redirect</h1>

    <div class="input-row">
      <input
        type="text"
        id="urlInput"
        placeholder="Enter a website URL..."
      />
      <button onclick="goToSite()">GO</button>
    </div>

    <div class="hint">
      Example: google.com or https://example.com
    </div>

    <!-- Tiny fallback link -->
    <div style="margin-top: 10px; font-size: 0.85rem;">
      <a href="#" id="fallbackLink" target="_blank">Open manually</a>
    </div>
  </div>

  <script>
    const input = document.getElementById("urlInput");
    const fallback = document.getElementById("fallbackLink");

    function formatURL(url) {
      url = url.trim();

      if (!url.startsWith("http://") &&
          !url.startsWith("https://")) {
        url = "https://" + url;
      }

      return url;
    }

    function goToSite() {
      let url = input.value;

      if (!url.trim()) return;

      url = formatURL(url);

      fallback.href = url;

      window.location.href = url;
    }

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        goToSite();
      }
    });

    input.addEventListener("input", () => {
      const url = formatURL(input.value || "#");
      fallback.href = url;
    });
  </script>

</body>
</html>

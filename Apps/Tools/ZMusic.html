<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZMusic Player</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',sans-serif;background:#121212;color:#fff;min-height:100vh;display:flex;flex-direction:column}
  header{padding:16px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:linear-gradient(180deg,rgba(20,20,20,.98),rgba(18,18,18,1));z-index:10}
  .logo{font-size:22px;font-weight:700;color:#1DB954;letter-spacing:-1px}
  .search-wrap{flex:1;max-width:500px;position:relative}
  .search-wrap input{width:100%;padding:10px 16px;border-radius:20px;border:none;background:#2a2a2a;color:#fff;font-size:14px;outline:none}
  .search-wrap input:focus{background:#333;box-shadow:0 0 0 2px #1DB954}
  .search-wrap input::placeholder{color:#666}
  .results{flex:1;padding:20px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;overflow-y:auto;align-content:start}
  .card{background:#1a1a1a;border-radius:8px;padding:12px;cursor:pointer;transition:background .2s;display:flex;flex-direction:column;align-items:center}
  .card:hover{background:#2a2a2a}
  .icon{width:64px;height:64px;background:#1DB954;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
  .icon svg{width:32px;height:32px;fill:#000}
  .card-title{font-size:13px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .card-sub{font-size:11px;color:#888;margin-top:4px}
  .player{position:fixed;bottom:0;left:0;right:0;background:#181818;border-top:1px solid #282828;padding:10px 16px;display:flex;align-items:center;gap:12px;z-index:20}
  .player-info{min-width:0;flex-shrink:0;max-width:120px}
  .player-title{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .controls{display:flex;align-items:center;gap:12px;flex:1;justify-content:center}
  .ctrl-btn{background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;padding:4px}
  .ctrl-btn svg{width:20px;height:20px;fill:#fff}
  .ctrl-btn:hover svg{fill:#1DB954}
  .play-btn{width:34px;height:34px;border-radius:50%;background:#fff}
  .play-btn svg{fill:#000;width:16px;height:16px}
  .play-btn:hover{transform:scale(1.05)}
  .volume-wrap{display:flex;align-items:center;gap:6px;min-width:80px;flex-shrink:0}
  .volume-wrap svg{width:16px;height:16px;fill:#fff}
  .volume-wrap input[type=range]{flex:1;accent-color:#1DB954;height:3px}
  .progress-wrap{flex:1;max-width:400px;display:flex;align-items:center;gap:6px}
  .progress-wrap span{font-size:10px;color:#888;min-width:28px;text-align:center}
  .progress-bar{flex:1;height:3px;background:#444;border-radius:2px;cursor:pointer;position:relative}
  .progress-fill{height:100%;background:#1DB954;border-radius:2px;width:0;transition:width .1s}
  .progress-bar:hover .progress-fill{background:#1ed760}
  .loading{text-align:center;padding:40px;color:#888;font-size:14px;grid-column:1/-1}
  .empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:#888;font-size:14px}
  .playing-card{box-shadow:0 0 0 2px #1DB954}
  @media(max-width:600px){header{padding:12px}.results{padding:12px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}.player{flex-wrap:wrap;gap:6px;padding:8px 12px}.progress-wrap{order:10;width:100%;max-width:100%}.volume-wrap{display:none}.player-info{max-width:80px}}
</style>
</head>
<body>
<header>
  <div class="logo">ZMusic</div>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Filter songs..." autocomplete="off">
  </div>
</header>
<div class="results" id="results"><div class="loading">Loading tracks...</div></div>
<div class="player" id="player" style="display:none">
  <div class="player-info">
    <div class="player-title" id="playerTitle"></div>
  </div>
  <div class="controls">
    <button class="ctrl-btn" id="prevBtn"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
    <button class="ctrl-btn play-btn" id="playPauseBtn"><svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg id="pauseIcon" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></button>
    <button class="ctrl-btn" id="nextBtn"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
  </div>
  <div class="progress-wrap">
    <span id="currentTime">0:00</span>
    <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
    <span id="duration">0:00</span>
  </div>
  <div class="volume-wrap">
    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
    <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
  </div>
</div>
<audio id="audio" preload="auto" crossorigin="anonymous"></audio>
<script>
const searchInput=document.getElementById('searchInput');
const resultsEl=document.getElementById('results');
const audio=document.getElementById('audio');
const playerEl=document.getElementById('player');
const playerTitle=document.getElementById('playerTitle');
const playPauseBtn=document.getElementById('playPauseBtn');
const playIcon=document.getElementById('playIcon');
const pauseIcon=document.getElementById('pauseIcon');
const prevBtn=document.getElementById('prevBtn');
const nextBtn=document.getElementById('nextBtn');
const progressFill=document.getElementById('progressFill');
const progressBar=document.getElementById('progressBar');
const currentTimeEl=document.getElementById('currentTime');
const durationEl=document.getElementById('duration');
const volumeSlider=document.getElementById('volumeSlider');

let allTracks=[];
let tracks=[];
let currentIdx=-1;
let isPlaying=false;

const REPO='hyperzteam555/hyperzhubapps';
const FOLDER='Music';
const BRANCH='main';

async function loadTracks(){
  try{
    const res=await fetch(`https://api.github.com/repos/${REPO}/contents/${FOLDER}`);
    if(!res.ok) throw new Error('Failed to load repository');
    const data=await res.json();
    allTracks=data.filter(f=>f.type==='file' && /\.(mp3|wav|ogg|m4a|aac|flac)$/i.test(f.name))
      .map(f=>({
        name:f.name.replace(/\.[^/.]+$/,""),
        file:f.name,
        url:`https://raw.githubusercontent.com/${REPO}/${BRANCH}/${FOLDER}/${f.name}`
      }));
    tracks=allTracks;
    renderTracks(tracks);
  }catch(e){
    resultsEl.innerHTML=`<div class="empty">Error loading tracks: ${e.message}</div>`;
  }
}

function renderTracks(list){
  if(!list.length){resultsEl.innerHTML='<div class="empty">No tracks found</div>';return}
  resultsEl.innerHTML=list.map((t,i)=>`
    <div class="card" data-idx="${i}">
      <div class="icon"><svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg></div>
      <div class="card-title" title="${t.name}">${t.name}</div>
      <div class="card-sub">${t.file.split('.').pop().toUpperCase()}</div>
    </div>
  `).join('');
  document.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('click',()=>playTrack(+c.dataset.idx));
  });
}

searchInput.addEventListener('input',e=>{
  const q=e.target.value.toLowerCase();
  tracks=allTracks.filter(t=>t.name.toLowerCase().includes(q));
  renderTracks(tracks);
  if(currentIdx>=0) updatePlayingState();
});

function playTrack(idx){
  currentIdx=idx;
  const t=tracks[idx];
  playerEl.style.display='flex';
  playerTitle.textContent=t.name;
  audio.pause();
  audio.src=t.url;
  audio.load();
  audio.play().then(()=>{isPlaying=true;updatePlayBtn()}).catch(()=>{});
  updatePlayingState();
}

function updatePlayingState(){
  document.querySelectorAll('.card').forEach(c=>{
    c.classList.toggle('playing-card',+c.dataset.idx===currentIdx);
  });
}

function togglePlay(){
  if(!tracks.length||currentIdx<0)return;
  if(isPlaying){audio.pause();isPlaying=false}
  else{audio.play().catch(()=>{});isPlaying=true}
  updatePlayBtn();
}

function updatePlayBtn(){
  playIcon.style.display=isPlaying?'none':'block';
  pauseIcon.style.display=isPlaying?'block':'none';
}

function prevTrack(){
  if(!tracks.length)return;
  playTrack((currentIdx-1+tracks.length)%tracks.length);
}

function nextTrack(){
  if(!tracks.length)return;
  playTrack((currentIdx+1)%tracks.length);
}

playPauseBtn.addEventListener('click',togglePlay);
prevBtn.addEventListener('click',prevTrack);
nextBtn.addEventListener('click',nextTrack);
volumeSlider.addEventListener('input',()=>{audio.volume=volumeSlider.value});
progressBar.addEventListener('click',e=>{
  const r=progressBar.getBoundingClientRect();
  audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration;
});

audio.addEventListener('timeupdate',()=>{
  if(!audio.duration)return;
  progressFill.style.width=(audio.currentTime/audio.duration*100)+'%';
  currentTimeEl.textContent=fmt(audio.currentTime);
  durationEl.textContent=fmt(audio.duration);
});
audio.addEventListener('ended',nextTrack);
audio.addEventListener('error',()=>{
  console.warn('Stream error, skipping to next...');
  nextTrack();
});

function fmt(s){const m=Math.floor(s/60);const sec=Math.floor(s%60);return m+':'+(sec<10?'0':'')+sec}

loadTracks();
</script>
</body>
</html>

function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function rp(a){return a[Math.floor(Math.random()*a.length)];}
function randIp(){return `${ri(1,254)}.${ri(0,255)}.${ri(0,255)}.${ri(1,254)}`;}
function si(seed,max){let h=0;for(let i=0;i<seed.length;i++){h=Math.imul(31,h)+seed.charCodeAt(i)|0;}return Math.abs(h)%max;}
function sp(arr,seed,off=''){return arr[si(seed+off,arr.length)];}
function sint(min,max,seed,off=''){return min+si(seed+off,max-min+1);}
function sip(seed){return `${sint(1,254,seed,'a')}.${sint(0,255,seed,'b')}.${sint(0,255,seed,'c')}.${sint(1,254,seed,'d')}`;}

function generateTarget(k){
  const cd=sp(city_data,k,'city');
  const zip=cd.zip_prefix+String(sint(100,999,k,'zip'));
  const open=ports_pool.filter((_,i)=>si(k+'port'+i,3)>0).slice(0,sint(3,7,k,'portct'));
  const nf=k.split(' ')[0];
  return{
    ip:sip(k),
    isp:sp(isps,k,'isp'),
    asn:'AS'+sint(10000,65000,k,'asn'),
    street:sint(100,9999,k,'snum')+' '+sp(streets,k,'st'),
    city:cd.city,state:cd.state,zip,
    device:sp(devices,k,'dev'),
    browser:sp(browsers,k,'br'),
    os:sp(os_list,k,'os'),
    email:nf+sint(1,9999,k,'em')+'@'+sp(emails_d,k,'emd'),
    hash:sp(hashes,k,'hsh')+sint(100,999,k,'hshx'),
    password:sp(words,k,'pw'),
    ports:open,
    mac:[...Array(6)].map((_,i)=>sint(0,255,k,'mac'+i).toString(16).padStart(2,'0')).join(':'),
    timezone:sp(timezones,k,'tz'),
    lat:(sint(250,490,k,'lat')/10).toFixed(1),
    lon:('-'+(sint(700,1240,k,'lon')/10).toFixed(1)),
    phone:`(${sint(200,999,k,'ph1')}) ${sint(100,999,k,'ph2')}-${sint(1000,9999,k,'ph3')}`,
    dob:`${sint(1,12,k,'dobm')}/${sint(1,28,k,'dobd')}/${sint(1990,2005,k,'doby')}`,
    ssn:`***-**-${sint(1000,9999,k,'ssn')}`,
  };
}

function print(text,cls='w',d=0){
  return new Promise(res=>setTimeout(()=>{
    const el=document.createElement('div');
    el.className=`line ${cls}`;el.textContent=text;
    out.appendChild(el);out.scrollTop=out.scrollHeight;res();
  },d));
}
async function tl(lines){for(const[t,c,d]of lines)await print(t,c,d||0);}
async function dl(ms){return new Promise(r=>setTimeout(r,ms));}
async function progress(label,steps=6,speed=110){
  await print('');
  const bars=['[          ]','[##        ]','[####      ]','[######    ]','[########  ]','[##########]'];
  const el=document.createElement('div');el.className='line g3';el.textContent=label+' '+bars[0];
  out.appendChild(el);
  for(let i=1;i<steps;i++){await dl(speed);el.textContent=label+' '+bars[Math.floor(i*(bars.length-1)/(steps-1))];}
  out.scrollTop=out.scrollHeight;
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZEditor++</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #1e1e1e;
        color: #ddd;
        display: flex;
        flex-direction: column;
        height: 100vh;
    }

    header {
        background: #2b2b2b;
        padding: 10px;
        display: flex;
        gap: 10px;
        align-items: center;
    }

    button {
        background: #3a3a3a;
        border: none;
        color: white;
        padding: 6px 10px;
        cursor: pointer;
        border-radius: 4px;
    }

    button:hover {
        background: #555;
    }

    textarea {
        flex: 1;
        width: 100%;
        border: none;
        outline: none;
        resize: none;
        padding: 10px;
        font-family: monospace;
        font-size: 14px;
        background: #1e1e1e;
        color: #00ffcc;
    }

    footer {
        background: #2b2b2b;
        padding: 5px;
        font-size: 12px;
        text-align: center;
    }
</style>
</head>
<body>

<header>
    <button onclick="newFile()">New</button>
    <button onclick="saveFile()">Save File</button>
    <button onclick="loadFile()">Load File</button>
    <input type="file" id="fileInput" style="display:none" onchange="handleFile(event)" />
</header>

<textarea id="editor" placeholder="Start typing in ZEditor++..."></textarea>

<footer>ZEditor++ Minimal Notepad</footer>

<script>
function newFile() {
    document.getElementById('editor').value = '';
}

function saveFile() {
    const text = document.getElementById('editor').value;
    const blob = new Blob([text], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;
    a.download = 'ZEditor++_file.txt';

    // Fix for browser compatibility
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    URL.revokeObjectURL(url);
}

function loadFile() {
    const input = document.getElementById('fileInput');
    input.value = ''; // allow reloading same file
    input.click();
}

function handleFile(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        document.getElementById('editor').value = e.target.result;
    };
    reader.readAsText(file);
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.20/index.css" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0f;
            color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .calculator-wrapper { width: 100%; max-width: 480px; }
        .calculator {
            background: #14141c;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
        }
        .mode-toggle { display: flex; background: #1a1a24; padding: 4px; margin: 12px 12px 0; border-radius: 10px; }
        .mode-btn {
            flex: 1; padding: 10px; border: none; background: transparent; color: #666;
            font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer;
            border-radius: 8px; transition: all 0.25s ease; letter-spacing: 0.5px;
        }
        .mode-btn.active { background: #2a2a3a; color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
        
        .input-area {
            margin: 12px 16px 8px;
            position: relative;
        }
        .calc-input {
            width: 100%;
            background: #1a1a24;
            border: 1px solid #2a2a3a;
            border-radius: 12px;
            padding: 14px 16px;
            font-family: 'Inter', monospace;
            font-size: 24px;
            font-weight: 300;
            color: #fff;
            text-align: right;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .calc-input:focus {
            border-color: #7c5cfc;
            box-shadow: 0 0 0 2px rgba(124,92,252,0.15);
        }
        .calc-input::placeholder { color: #444; }
        
        .display-container { padding: 8px 16px 16px; min-height: 100px; display: flex; flex-direction: column; justify-content: flex-end; }
        .expression {
            font-size: 13px; color: #555; text-align: right; min-height: 18px;
            margin-bottom: 4px; overflow-x: auto; white-space: nowrap; scrollbar-width: none;
        }
        .expression::-webkit-scrollbar { display: none; }
        .display {
            font-size: 38px; font-weight: 300; text-align: right; color: #fff;
            overflow-x: auto; white-space: nowrap; scrollbar-width: none; line-height: 1.2;
        }
        .display::-webkit-scrollbar { display: none; }
        .display.small { font-size: 26px; }
        .bigint-indicator { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 8px; min-height: 26px; }
        .bigint-badge { font-size: 10px; font-weight: 700; color: #7c5cfc; background: rgba(124,92,252,0.12); padding: 3px 8px; border-radius: 4px; letter-spacing: 0.5px; }
        .toggle-full {
            font-size: 11px; color: #7c5cfc; cursor: pointer; background: none; border: none;
            font-family: 'Inter', sans-serif; font-weight: 500; padding: 3px 6px; border-radius: 4px; transition: background 0.2s;
        }
        .toggle-full:hover { background: rgba(124,92,252,0.1); }
        .buttons-container { padding: 8px 10px 14px; }
        .scientific-grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 8px;
            max-height: 0; overflow: hidden; transition: max-height 0.35s ease, opacity 0.25s ease;
            opacity: 0;
        }
        .scientific-grid.visible { max-height: 300px; opacity: 1; }
        .basic-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .btn {
            padding: 16px 8px; border: none; border-radius: 14px; font-family: 'Inter', sans-serif;
            font-size: 17px; font-weight: 500; cursor: pointer; transition: all 0.15s ease;
            position: relative; overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent;
        }
        .btn::after {
            content: ''; position: absolute; inset: 0; background: rgba(255,255,255,0); transition: background 0.15s;
        }
        .btn:active::after { background: rgba(255,255,255,0.08); }
        .btn-sci { background: #1c1c28; color: #9a8ec2; font-size: 13px; font-weight: 600; padding: 12px 6px; letter-spacing: -0.2px; }
        .btn-sci:hover { background: #24243a; }
        .btn-number { background: #22222e; color: #f0f0f0; }
        .btn-number:hover { background: #2c2c3a; }
        .btn-op { background: #2a2a3a; color: #a78bfa; font-size: 20px; }
        .btn-op:hover { background: #343448; }
        .btn-op.active-op { background: #7c5cfc; color: #fff; }
        .btn-func { background: #1a1a26; color: #888; font-size: 15px; }
        .btn-func:hover { background: #222230; color: #aaa; }
        .btn-equals { background: #7c5cfc; color: #fff; font-size: 24px; font-weight: 400; }
        .btn-equals:hover { background: #8b6cff; }
        .btn-clear { background: #2a1a2e; color: #e85c7a; }
        .btn-clear:hover { background: #3a2238; }
        .btn-wide { grid-column: span 2; }
        .btn-tiny { padding: 14px 6px; font-size: 13px; }
        .history-panel {
            margin-top: 12px; background: #14141c; border-radius: 16px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.04);
            max-height: 0; transition: max-height 0.35s ease;
        }
        .history-panel.visible { max-height: 400px; }
        .history-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid #222; }
        .history-header span { font-size: 13px; font-weight: 600; color: #666; letter-spacing: 0.5px; }
        .history-clear-btn { font-size: 11px; color: #e85c7a; background: none; border: none; font-family: 'Inter', sans-serif; cursor: pointer; font-weight: 600; }
        .history-list { padding: 8px 0; max-height: 280px; overflow-y: auto; }
        .history-list::-webkit-scrollbar { width: 4px; }
        .history-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
        .history-item { padding: 10px 16px; cursor: pointer; transition: background 0.15s; }
        .history-item:hover { background: #1a1a24; }
        .history-expr { font-size: 12px; color: #555; }
        .history-result { font-size: 16px; color: #ccc; font-weight: 300; }
        .angle-indicator { font-size: 11px; color: #7c5cfc; font-weight: 600; letter-spacing: 0.5px; cursor: pointer; user-select: none; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px 4px; }
        .inv-toggle {
            font-size: 11px; font-weight: 700; color: #555; background: #1a1a24; border: none;
            padding: 5px 10px; border-radius: 6px; cursor: pointer; font-family: 'Inter', sans-serif;
            letter-spacing: 0.5px; transition: all 0.2s;
        }
        .inv-toggle.active { color: #7c5cfc; background: rgba(124,92,252,0.12); }
        .mem-indicator { font-size: 10px; color: #555; font-weight: 700; letter-spacing: 0.5px; }
        .keyboard-hint {
            font-size: 10px;
            color: #3a3a4a;
            text-align: center;
            padding: 4px 0;
            letter-spacing: 0.3px;
        }
        @media (max-width: 500px) {
            .calculator-wrapper { max-width: 100%; }
            .btn { padding: 14px 6px; font-size: 15px; }
            .btn-sci { padding: 10px 4px; font-size: 11px; }
            .display { font-size: 32px; }
            .calc-input { font-size: 20px; padding: 12px 14px; }
        }
    </style>
</head>
<body>
    <div class="calculator-wrapper">
        <div class="calculator">
            <div class="mode-toggle">
                <button class="mode-btn active" data-mode="basic">BASIC</button>
                <button class="mode-btn" data-mode="scientific">SCIENTIFIC</button>
            </div>
            
            <div class="input-area">
                <input type="text" class="calc-input" id="calcInput" placeholder="Type here or click buttons..." autocomplete="off" spellcheck="false">
            </div>

            <div class="top-bar">
                <button class="inv-toggle" id="invBtn">INV</button>
                <span class="angle-indicator" id="angleMode">DEG</span>
                <span class="mem-indicator" id="memIndicator"></span>
                <span class="paren-count" id="parenCount"></span>
            </div>

            <div class="display-container">
                <div class="expression" id="expression"></div>
                <div class="display" id="display">0</div>
                <div class="bigint-indicator" id="bigintIndicator"></div>
            </div>

            <div class="buttons-container">
                <div class="scientific-grid" id="sciGrid">
                    <button class="btn btn-sci" data-val="sin">sin</button>
                    <button class="btn btn-sci" data-val="cos">cos</button>
                    <button class="btn btn-sci" data-val="tan">tan</button>
                    <button class="btn btn-sci" data-val="log">log</button>
                    <button class="btn btn-sci" data-val="ln">ln</button>
                    <button class="btn btn-sci" data-val="sqrt">√</button>
                    <button class="btn btn-sci" data-val="cbrt">∛</button>
                    <button class="btn btn-sci" data-val="x2">x²</button>
                    <button class="btn btn-sci" data-val="x3">x³</button>
                    <button class="btn btn-sci" data-val="x^y">xʸ</button>
                    <button class="btn btn-sci" data-val="1/x">1/x</button>
                    <button class="btn btn-sci" data-val="abs">|x|</button>
                    <button class="btn btn-sci" data-val="fact">n!</button>
                    <button class="btn btn-sci" data-val="π">π</button>
                    <button class="btn btn-sci" data-val="e">e</button>
                    <button class="btn btn-sci" data-val="(">(</button>
                    <button class="btn btn-sci" data-val=")">)</button>
                    <button class="btn btn-sci" data-val="rand">rand</button>
                    <button class="btn btn-sci" data-val="EE">EE</button>
                    <button class="btn btn-sci" data-val="mod">mod</button>
                </div>
                <div class="basic-grid" id="basicGrid">
                    <button class="btn btn-clear" data-val="AC">AC</button>
                    <button class="btn btn-func" data-val="DEL">DEL</button>
                    <button class="btn btn-func" data-val="%">%</button>
                    <button class="btn btn-op" data-val="÷">÷</button>
                    <button class="btn btn-number" data-val="7">7</button>
                    <button class="btn btn-number" data-val="8">8</button>
                    <button class="btn btn-number" data-val="9">9</button>
                    <button class="btn btn-op" data-val="×">×</button>
                    <button class="btn btn-number" data-val="4">4</button>
                    <button class="btn btn-number" data-val="5">5</button>
                    <button class="btn btn-number" data-val="6">6</button>
                    <button class="btn btn-op" data-val="−">−</button>
                    <button class="btn btn-number" data-val="1">1</button>
                    <button class="btn btn-number" data-val="2">2</button>
                    <button class="btn btn-number" data-val="3">3</button>
                    <button class="btn btn-op" data-val="+">+</button>
                    <button class="btn btn-number btn-wide" data-val="0">0</button>
                    <button class="btn btn-number" data-val=".">.</button>
                    <button class="btn btn-equals" data-val="=">=</button>
                </div>
                <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px;">
                    <button class="btn btn-func btn-tiny" data-val="mc">MC</button>
                    <button class="btn btn-func btn-tiny" data-val="mr">MR</button>
                    <button class="btn btn-func btn-tiny" data-val="m+">M+</button>
                    <button class="btn btn-func btn-tiny" data-val="m-">M−</button>
                </div>
                <div class="keyboard-hint">Keyboard: Type expressions directly • Enter to evaluate • Esc to clear</div>
            </div>
        </div>

        <div style="text-align: center; margin-top: 10px;">
            <button id="historyToggle" style="background: none; border: none; color: #444; font-family: 'Inter', sans-serif; font-size: 12px; cursor: pointer; font-weight: 500; letter-spacing: 0.5px;">▼ HISTORY</button>
        </div>
        <div class="history-panel" id="historyPanel">
            <div class="history-header">
                <span>HISTORY</span>
                <button class="history-clear-btn" id="historyClear">CLEAR ALL</button>
            </div>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <script>
        const state = {
            mode: 'basic',
            inv: false,
            angleDeg: true,
            currentInput: '0',
            expression: '',
            justEvaluated: false,
            memory: 0,
            hasMemory: false,
            showFullInt: false,
            isBigInt: false,
            parenDepth: 0,
            history: [],
            lastRepeatOp: null,
            lastRepeatVal: null,
            historyExpr: '',
            inputBuffer: ''
        };

        const display = document.getElementById('display');
        const expressionEl = document.getElementById('expression');
        const bigintIndicator = document.getElementById('bigintIndicator');
        const sciGrid = document.getElementById('sciGrid');
        const angleModeEl = document.getElementById('angleMode');
        const invBtn = document.getElementById('invBtn');
        const memIndicator = document.getElementById('memIndicator');
        const parenCount = document.getElementById('parenCount');
        const historyPanel = document.getElementById('historyPanel');
        const historyList = document.getElementById('historyList');
        const calcInput = document.getElementById('calcInput');

        function toRad(v) { return state.angleDeg ? (v * Math.PI / 180) : v; }
        function fromRad(v) { return state.angleDeg ? (v * 180 / Math.PI) : v; }

        function formatBigInt(n) {
            const s = n.toString();
            if (s.length <= 15) return s;
            return state.showFullInt ? s : n.toExponential(10);
        }

        function formatFloat(n) {
            if (Number.isNaN(n)) return 'Error';
            if (!Number.isFinite(n)) return n > 0 ? 'Infinity' : '-Infinity';
            const s = parseFloat(n.toPrecision(12));
            const str = s.toString();
            return str.length > 16 ? s.toExponential(8) : str;
        }

        function updateDisplay(val) {
            display.textContent = val;
            display.classList.toggle('small', val.length > 14);
        }

        function updateExpression(val) {
            state.historyExpr = val;
            expressionEl.textContent = val;
            expressionEl.scrollLeft = expressionEl.scrollWidth;
        }

        function updateBigintBadge() {
            if (state.isBigInt) {
                bigintIndicator.innerHTML = `
                    <span class="bigint-badge">BIGINT</span>
                    <button class="toggle-full" id="toggleFullBtn">
                        ${state.showFullInt ? 'SCIENTIFIC NOTATION' : 'SHOW FULL INTEGER'}
                    </button>`;
                document.getElementById('toggleFullBtn').addEventListener('click', () => {
                    state.showFullInt = !state.showFullInt;
                    updateBigintBadge();
                    try {
                        const bigVal = BigInt(state.currentInput.replace(/[^-\d]/g, ''));
                        updateDisplay(formatBigInt(bigVal));
                    } catch(e) {}
                });
            } else {
                bigintIndicator.innerHTML = '';
            }
        }

        function updateParenCount() {
            parenCount.textContent = state.parenDepth > 0 ? `(${state.parenDepth}` : '';
        }

        function updateMemoryIndicator() {
            memIndicator.textContent = state.hasMemory ? 'M' : '';
        }

        function parseAndEval(expr) {
            let p = expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/mod/g,'%');
            p = p.replace(/π/g, String(Math.PI)).replace(/e(?![x])/g, String(Math.E));
            p = p.replace(/(\d)(\()/g,'$1*$2').replace(/(\))(\d)/g,'$1*$2').replace(/(\))(\()/g,'$1*$2').replace(/(\d)([a-zA-Z])/g,'$1*$2').replace(/([a-zA-Z])(\d)/g,'$1*$2');
            p = p.replace(/sin\(/g,'_sin(').replace(/cos\(/g,'_cos(').replace(/tan\(/g,'_tan(')
               .replace(/asin\(/g,'_asin(').replace(/acos\(/g,'_acos(').replace(/atan\(/g,'_atan(')
               .replace(/log\(/g,'_log(').replace(/ln\(/g,'_ln(').replace(/sqrt\(/g,'_sqrt(')
               .replace(/cbrt\(/g,'_cbrt(').replace(/abs\(/g,'_abs(');
            
            const fns = {
                _sin: x => Math.sin(toRad(x)), _cos: x => Math.cos(toRad(x)), _tan: x => Math.tan(toRad(x)),
                _asin: x => fromRad(Math.asin(x)), _acos: x => fromRad(Math.acos(x)), _atan: x => fromRad(Math.atan(x)),
                _log: x => Math.log10(x), _ln: x => Math.log(x), _sqrt: x => Math.sqrt(x), _cbrt: x => Math.cbrt(x), _abs: x => Math.abs(x)
            };
            const fnNames = Object.keys(fns), fnVals = Object.values(fns);
            return new Function(...fnNames, `"use strict"; return (${p});`)(...fnVals);
        }

        function evalExpression(expr) {
            const hasFloat = /[.eE]/.test(expr) || /[a-zA-Z]/.test(expr.replace(/[π]/g,''));
            if (!hasFloat) {
                try {
                    let be = expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\^/g,'**').replace(/mod/g,'%');
                    const res = Function('"use strict"; return (' + be + ')')();
                    if (typeof res === 'bigint') { state.isBigInt = true; state.showFullInt = false; return formatBigInt(res); }
                    state.isBigInt = false; return formatFloat(res);
                } catch(e) { state.isBigInt = false; }
            }
            try { return formatFloat(parseAndEval(expr)); }
            catch(e) { return 'Error'; }
        }

        function normalizeInput(str) {
            return str
                .replace(/\*/g, '×')
                .replace(/\//g, '÷')
                .replace(/-/g, '−');
        }

        function denormalizeInput(str) {
            return str
                .replace(/×/g, '*')
                .replace(/÷/g, '/')
                .replace(/−/g, '-');
        }

        function handleInput(val) {
            if (val === 'AC') {
                Object.assign(state, { currentInput:'0', expression:'', justEvaluated:false, isBigInt:false, parenDepth:0, lastRepeatOp:null, lastRepeatVal:null, historyExpr:'' });
                updateDisplay('0'); updateExpression(''); updateBigintBadge(); updateParenCount();
                calcInput.value = '';
            } else if (val === 'DEL') {
                if (state.justEvaluated) {
                    state.currentInput = '0'; state.expression = ''; state.justEvaluated = false;
                    updateDisplay('0'); updateExpression('');
                } else {
                    state.currentInput = state.currentInput.slice(0, -1) || '0';
                    updateDisplay(state.currentInput);
                }
            } else if (val === '±') {
                if (state.currentInput === '0') return;
                state.currentInput = state.currentInput.startsWith('-') ? state.currentInput.slice(1) : '-' + state.currentInput;
                updateDisplay(state.currentInput);
            } else if (val === '=') {
                if (state.justEvaluated && state.lastRepeatOp && state.lastRepeatVal !== null) {
                    const repeatExpr = `${state.currentInput} ${state.lastRepeatOp} ${state.lastRepeatVal}`;
                    const res = evalExpression(repeatExpr);
                    updateExpression(repeatExpr + ' =');
                    state.currentInput = res;
                    updateDisplay(res); updateBigintBadge();
                    addHistory(repeatExpr + ' =', res);
                    return;
                }

                let expr = state.expression + state.currentInput;
                const closed = expr + ')'.repeat(state.parenDepth);
                const res = evalExpression(closed);
                
                let parts = state.expression.trim().split(/\s+/);
                if (parts.length >= 2) {
                    state.lastRepeatOp = parts[parts.length - 1];
                    state.lastRepeatVal = state.currentInput;
                }

                updateExpression(expr + ' =');
                state.currentInput = res; state.expression = ''; state.justEvaluated = true; state.parenDepth = 0;
                updateDisplay(res); updateParenCount(); updateBigintBadge();
                addHistory(expr + ' =', res);
                calcInput.value = '';
            } else if (['+', '−', '×', '÷', 'mod'].includes(val)) {
                if (state.justEvaluated) {
                    state.expression = state.currentInput + ' ' + val + ' ';
                } else {
                    state.expression += state.currentInput + ' ' + val + ' ';
                }
                state.currentInput = '0'; state.justEvaluated = false;
                state.lastRepeatOp = null; state.lastRepeatVal = null;
                updateExpression(state.expression);
                updateDisplay(state.currentInput);
            } else if (val === '^') {
                state.expression += state.currentInput + ' ^ ';
                state.currentInput = '0'; state.justEvaluated = false;
                state.lastRepeatOp = null; state.lastRepeatVal = null;
                updateExpression(state.expression);
            } else if (val === 'EE') {
                state.expression += state.currentInput + ' ×10^';
                state.currentInput = '0'; state.justEvaluated = false;
                state.lastRepeatOp = null; state.lastRepeatVal = null;
                updateExpression(state.expression);
            } else if (val === '%') {
                try {
                    const expr = state.expression + state.currentInput;
                    const res = evalExpression(expr + ')'.repeat(state.parenDepth));
                    state.currentInput = formatFloat(parseFloat(res) / 100);
                    state.isBigInt = false; updateDisplay(state.currentInput); updateBigintBadge();
                } catch(e) {}
            } else if (val === '(') {
                if (state.justEvaluated) { state.currentInput = '('; state.expression = ''; state.justEvaluated = false; }
                else { state.expression += state.currentInput + '('; state.currentInput = '0'; }
                state.parenDepth++; updateExpression(state.expression); updateParenCount();
            } else if (val === ')') {
                if (state.parenDepth > 0) {
                    state.expression += state.currentInput + ')'; state.parenDepth--; state.currentInput = '0';
                    updateExpression(state.expression); updateParenCount();
                }
            } else if (val === 'mc') { state.memory = 0; state.hasMemory = false; updateMemoryIndicator(); }
            else if (val === 'mr') { if(state.hasMemory){ state.currentInput = formatFloat(state.memory); state.isBigInt=false; updateDisplay(state.currentInput); updateBigintBadge(); } }
            else if (val === 'm+') {
                try { const res = evalExpression(state.expression + state.currentInput + ')'.repeat(state.parenDepth)); state.memory += parseFloat(res); state.hasMemory = true; updateMemoryIndicator(); } catch(e) {}
            } else if (val === 'm-') {
                try { const res = evalExpression(state.expression + state.currentInput + ')'.repeat(state.parenDepth)); state.memory -= parseFloat(res); state.hasMemory = true; updateMemoryIndicator(); } catch(e) {}
            } else if ('0123456789.'.includes(val)) {
                if (state.justEvaluated) { state.currentInput = val==='.' ? '0.' : val; state.expression = ''; state.justEvaluated = false; state.lastRepeatOp = null; state.lastRepeatVal = null; updateExpression(''); }
                else { 
                    if (val==='.' && state.currentInput.includes('.')) return; 
                    state.currentInput = state.currentInput==='0' && val!=='.' ? val : state.currentInput + val; 
                }
                updateDisplay(state.currentInput);
            }
        }

        const sciLabelMap = {
            sin: ['sin', 'sin⁻¹'], cos: ['cos', 'cos⁻¹'], tan: ['tan', 'tan⁻¹'],
            log: ['log', '10ˣ'], ln: ['ln', 'eˣ'], sqrt: ['√', 'x²']
        };

        function handleScientific(val) {
            let fn = val;
            if (state.inv) {
                if (val === 'sin') fn = 'asin';
                else if (val === 'cos') fn = 'acos';
                else if (val === 'tan') fn = 'atan';
                else if (val === 'log') fn = '10^x';
                else if (val === 'ln') fn = 'e^x';
                else if (val === 'sqrt') fn = 'x2';
            } else {
                if (val === 'asin') fn = 'sin';
                else if (val === 'acos') fn = 'cos';
                else if (val === 'atan') fn = 'tan';
                else if (val === '10^x') fn = 'log';
                else if (val === 'e^x') fn = 'ln';
                else if (val === 'x2') fn = 'sqrt';
            }

            const cur = parseFloat(state.currentInput);
            let res;
            switch(fn) {
                case 'sin': res = Math.sin(toRad(cur)); break;
                case 'cos': res = Math.cos(toRad(cur)); break;
                case 'tan': res = Math.tan(toRad(cur)); break;
                case 'asin': res = fromRad(Math.asin(cur)); break;
                case 'acos': res = fromRad(Math.acos(cur)); break;
                case 'atan': res = fromRad(Math.atan(cur)); break;
                case 'log': res = Math.log10(cur); break;
                case 'ln': res = Math.log(cur); break;
                case 'sqrt': res = Math.sqrt(cur); break;
                case 'cbrt': res = Math.cbrt(cur); break;
                case 'x2': res = Math.pow(cur, 2); break;
                case 'x3': res = Math.pow(cur, 3); break;
                case 'x^y': handleInput('^'); return;
                case '1/x': res = 1 / cur; break;
                case '10^x': res = Math.pow(10, cur); break;
                case 'e^x': res = Math.exp(cur); break;
                case 'abs': res = Math.abs(cur); break;
                case 'fact':
                    const n = Math.floor(cur);
                    if (n < 0 || n > 170) res = NaN;
                    else { let f=1; for(let i=2;i<=n;i++) f*=i; res=f; }
                    break;
                case 'π': state.currentInput = Math.PI.toString(); if(state.justEvaluated){state.expression='';state.justEvaluated=false;} updateExpression(''); return;
                case 'e': state.currentInput = Math.E.toString(); if(state.justEvaluated){state.expression='';state.justEvaluated=false;} updateExpression(''); return;
                case 'rand': state.currentInput = Math.random().toString(); if(state.justEvaluated){state.expression='';state.justEvaluated=false;} return;
                case '(': handleInput('('); return;
                case ')': handleInput(')'); return;
                case 'EE': handleInput('EE'); return;
                case 'mod': handleInput('mod'); return;
                default: return;
            }
            state.currentInput = isNaN(res) ? 'Error' : formatFloat(res);
            state.expression = ''; state.justEvaluated = true; state.isBigInt = false;
            updateDisplay(state.currentInput); updateExpression(state.historyExpr || '');
            updateBigintBadge();
        }

        function addHistory(expr, result) {
            state.history.unshift({expr, result});
            if (state.history.length > 50) state.history.pop();
            renderHistory();
        }

        function renderHistory() {
            historyList.innerHTML = state.history.map((h,i) => `<div class="history-item" data-idx="${i}"><div class="history-expr">${h.expr}</div><div class="history-result">${h.result}</div></div>`).join('');
            historyList.querySelectorAll('.history-item').forEach(item => {
                item.addEventListener('click', () => {
                    const idx = parseInt(item.dataset.idx);
                    state.currentInput = state.history[idx].result; state.expression = ''; state.justEvaluated = true;
                    updateDisplay(state.currentInput); updateExpression('');
                    state.isBigInt = false; updateBigintBadge();
                    calcInput.value = '';
                });
            });
        }

        function updateSciLabels() {
            sciGrid.querySelectorAll('.btn-sci').forEach(btn => {
                const v = btn.dataset.val;
                if (sciLabelMap[v]) {
                    btn.textContent = state.inv ? sciLabelMap[v][1] : sciLabelMap[v][0];
                }
            });
        }

        document.querySelectorAll('.btn[data-val]').forEach(btn => {
            btn.addEventListener('click', () => {
                const v = btn.dataset.val;
                if (['sin','cos','tan','sqrt','log','ln','asin','acos','atan','x2','x3','x^y','1/x','10^x','e^x','abs','fact','π','e','rand','(',')','EE','mod','cbrt'].includes(v)) {
                    handleScientific(v);
                } else {
                    handleInput(v);
                }
            });
        });

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.mode = btn.dataset.mode;
                sciGrid.classList.toggle('visible', state.mode === 'scientific');
                calcInput.focus();
            });
        });

        invBtn.addEventListener('click', () => {
            state.inv = !state.inv;
            invBtn.classList.toggle('active', state.inv);
            updateSciLabels();
        });

        angleModeEl.addEventListener('click', () => { state.angleDeg = !state.angleDeg; angleModeEl.textContent = state.angleDeg ? 'DEG' : 'RAD'; });

        document.getElementById('historyToggle').addEventListener('click', () => {
            const isOpen = historyPanel.classList.toggle('visible');
            document.getElementById('historyToggle').textContent = isOpen ? '▲ HISTORY' : '▼ HISTORY';
        });

        document.getElementById('historyClear').addEventListener('click', () => { state.history = []; renderHistory(); });

        // Keyboard input handling via the text input field
        calcInput.addEventListener('input', (e) => {
            const val = e.target.value;
            // Normalize for display
            state.inputBuffer = val;
            
            // Update display with the input
            if (val.trim()) {
                // Try to evaluate on the fly for preview
                try {
                    let denorm = denormalizeInput(val);
                    denorm = denorm.replace(/π/g, String(Math.PI)).replace(/e(?![x])/g, String(Math.E));
                    denorm = denorm.replace(/(\d)(\()/g, '$1*$2').replace(/(\))(\d)/g, '$1*$2');
                    denorm = denorm.replace(/\^/g, '**');
                    const preview = Function('"use strict"; return (' + denorm + ')')();
                    updateDisplay(formatFloat(preview));
                    expressionEl.textContent = val;
                } catch(e) {
                    updateDisplay(val);
                    expressionEl.textContent = '';
                }
            } else {
                updateDisplay(state.currentInput || '0');
                expressionEl.textContent = state.historyExpr || '';
            }
        });

        calcInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const input = calcInput.value.trim();
                if (!input) return;
                
                // Normalize input
                let normalized = input
                    .replace(/\*/g, '×')
                    .replace(/\//g, '÷')
                    .replace(/-/g, '−');
                
                // Evaluate
                try {
                    let denorm = denormalizeInput(normalized);
                    const res = evalExpression(denorm);
                    
                    updateExpression(normalized + ' =');
                    state.currentInput = res;
                    state.expression = '';
                    state.justEvaluated = true;
                    state.parenDepth = 0;
                    state.lastRepeatOp = null;
                    state.lastRepeatVal = null;
                    
                    updateDisplay(res);
                    updateParenCount();
                    updateBigintBadge();
                    addHistory(normalized + ' =', res);
                    
                    // Clear input for next calculation
                    calcInput.value = '';
                } catch(err) {
                    // Try with the original expression format
                    try {
                        let denorm = input.replace(/\^/g, '**')
                                         .replace(/mod/g, '%')
                                         .replace(/π/g, String(Math.PI))
                                         .replace(/e(?![x])/g, String(Math.E));
                        denorm = denorm.replace(/(\d)(\()/g, '$1*$2').replace(/(\))(\d)/g, '$1*$2');
                        const res = Function('"use strict"; return (' + denorm + ')')();
                        
                        updateExpression(input + ' =');
                        state.currentInput = isNaN(res) ? 'Error' : formatFloat(res);
                        state.expression = '';
                        state.justEvaluated = true;
                        state.parenDepth = 0;
                        
                        updateDisplay(state.currentInput);
                        addHistory(input + ' =', state.currentInput);
                        
                        calcInput.value = '';
                    } catch(e2) {
                        updateDisplay('Error');
                        state.currentInput = 'Error';
                        state.justEvaluated = true;
                    }
                }
            } else if (e.key === 'Escape') {
                handleInput('AC');
                calcInput.value = '';
            } else if (e.key === 'Backspace') {
                // Let the input handle it naturally
            }
        });

        // Focus input on page load
        window.addEventListener('load', () => {
            setTimeout(() => calcInput.focus(), 100);
        });

        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
